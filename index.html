    <div class="acoes"><button class="btn sec" id="cpMsg">Copiar mensagem</button>${f.pix?'<button class="btn sec" id="cpPix">Copiar Pix</button>':''}
    ${(f.driveCemigId||f.driveSeltecId) && S.mcp ? `<button class="btn sec" id="arqDrive">${f.driveArquivadoEm?'Arquivar no Drive de novo':'Arquivar no Drive agora'}</button>`:''}
    ${f.calc?.tipo!=='so_cemig'?'<button class="btn sec" id="descExtra">Desconto extra</button>':''}
    <button class="btn sec" id="regerar">Refazer PDF</button><button class="btn perigo" id="exFat">Excluir</button><button class="btn" id="fechar">Fechar</button></div>`);
  $('#fechar').onclick = fecharModal;
  $('#cpMsg').onclick = () => navigator.clipboard.writeText(textoWhats(f)).then(()=>toast('Mensagem copiada'), ()=>toast('Não consegui copiar','erro'));
  if (f.pix) $('#cpPix').onclick = () => navigator.clipboard.writeText(f.pix).then(()=>toast('Pix copiado'), ()=>toast('Não consegui copiar','erro'));
  $('#regerar').onclick = async () => { fecharModal(); await regerarPdf(f); };
  const de = $('#descExtra'); if (de) de.onclick = () => aplicarDesconto(f);
  const ad = $('#arqDrive'); if (ad) ad.onclick = async () => { fecharModal(); await arquivarNoDrive(f); };
  $('#exFat').onclick = async () => { fecharModal(); if (await confirmar(`Excluir a fatura de ${cli.nome} (${compLabel(f.competencia)})?`, 'Excluir')){
    if (S.assets) for (const k of ['pdfId','cemigPdfId']) if (f[k]) S.assets.delete(f[k]).catch(()=>{});
    await apagar('faturas', f.id); if (!S.db) render(); toast('Fatura excluída'); } };
}

/* ===== Desconto extra depois de gerada ===== */
function aplicarDesconto(f){
  const cli = S.clientes[f.clienteId]; if (!cli || !f.calc) return;
  const ehVenda = f.calc.tipo === 'venda';
  const aj = f.ajuste || {};
  const padrao = cli.desconto ?? 30;
  abrirModal(`<h3 class="tit-ic">${ic('faturas')} Desconto extra · ${esc(cli.nome)}</h3>
    <p class="muted small">${compLabel(f.competencia)} · valor atual ${brl(f.calc.valorAPagar)}${ehVenda?` · ${fmtN(f.calc.desconto,2)}% na tarifa`:''}</p>
    ${f.status==='enviada'?'<div class="alerta">Esta fatura já foi enviada. Depois de aplicar, mande o PDF novo para o cliente.</div>':''}
    ${f.status==='paga'?'<div class="alerta">Esta fatura já está marcada como paga.</div>':''}
    <p class="small">Pode usar um ou os dois: a porcentagem muda o desconto da tarifa, e o valor em reais entra em "Outros descontos".</p>
    <div class="campos">
      <label class="campo">${ehVenda?`Desconto na tarifa (%) <small>(padrão do cliente: ${fmtN(padrao,0)}%)</small>`:'Desconto sobre o valor a cobrar (%)'}<input id="dPct" inputmode="decimal" value="${ehVenda?fmtN(aj.desconto ?? f.calc.desconto,2):fmtN(aj.descontoCobranca||0,2)}"></label>
      <label class="campo">Desconto em reais (R$)<input id="dRs" inputmode="decimal" value="${fmtN(aj.outrosDescontos||0,2)}"></label>
      ${ehVenda?`<label class="check larg"><input type="checkbox" id="dInteira" ${(aj.contaInteira ?? cli.repassarContaInteira)?'checked':''}> Cobrar a conta Cemig inteira em "Fatura Cemig" (${brl(f.cemig?.total)}), em vez de só as taxas (${brl(f.cemig?.taxas)})</label>`:''}
      <label class="campo larg">Motivo (fica registrado)<input id="dMot" placeholder="Ex.: combinado com o Jomar"></label>
    </div>
    <div id="dPrev"></div>
    <div class="acoes">${aj.desconto!=null || aj.outrosDescontos || aj.descontoCobranca || aj.contaInteira!=null ? '<button class="btn sec" id="dTirar">Voltar ao normal</button>':''}<button class="btn sec" id="dCanc">Cancelar</button><button class="btn" id="dOk">Aplicar e refazer PDF</button></div>
    ${(f.descontosAplicados||[]).length?`<h4>Histórico de descontos</h4><ul class="lista">${f.descontosAplicados.map(d=>`<li><b>${esc(d.descricao)}</b><span>${new Date(d.em).toLocaleString('pt-BR')}${d.motivo?' · '+esc(d.motivo):''} · ${brl(d.de)} → ${brl(d.para)}</span></li>`).join('')}</ul>`:''}`);
  const novoAjuste = () => {
    const n = {...aj}; const p = num($('#dPct').value), r = num($('#dRs').value) || 0;
    if (ehVenda){ if (p == null || p === padrao) delete n.desconto; else n.desconto = p;
      const ci = $('#dInteira').checked; if (ci === !!cli.repassarContaInteira) delete n.contaInteira; else n.contaInteira = ci; delete n.taxas; }
    else { if (p) n.descontoCobranca = p; else delete n.descontoCobranca; }
    if (r) n.outrosDescontos = r; else delete n.outrosDescontos;
    return n;
  };
  const descricao = n => [ehVenda && n.desconto!=null ? `${fmtN(n.desconto,2)}% na tarifa` : '', !ehVenda && n.descontoCobranca ? `${fmtN(n.descontoCobranca,2)}% sobre o valor` : '',
    n.outrosDescontos ? `${brl(n.outrosDescontos)} em outros descontos` : '', n.contaInteira===true ? 'conta Cemig inteira' : n.contaInteira===false ? 'só taxas da Cemig' : ''].filter(Boolean).join(' + ') || 'Desconto normal';
  const prev = () => {
    let c2; try { c2 = calcFatura(cli, f.cemig, novoAjuste(), f.competencia); } catch(e){ $('#dPrev').innerHTML = `<div class="alerta">${esc(e.message)}</div>`; return; }
    $('#dPrev').innerHTML = `<table class="calc">
      ${ehVenda?`<tr><td>Energia</td><td>${fmtN(c2.kwh)} kWh × ${fmtN(c2.tarifaDesc,6)} (${fmtN(c2.desconto,2)}%)</td><td>${brl(c2.valorEnergia)}</td></tr>
      <tr><td>Fatura Cemig</td><td>${c2.contaInteira?'conta inteira':'só taxas'}</td><td>${brl(c2.taxas)}</td></tr>`:''}
      ${c2.outros?`<tr><td>Outros descontos</td><td></td><td>- ${brl(c2.outros)}</td></tr>`:''}
      <tr class="mut"><td>Valor atual</td><td></td><td>${brl(f.calc.valorAPagar)}</td></tr>
      <tr class="tot"><td>Novo valor</td><td></td><td>${brl(c2.valorAPagar)}</td></tr>
      ${ehVenda?`<tr class="mut"><td>Cliente pagaria / economia</td><td></td><td>${brl(c2.pagaria)} / ${brl(c2.economia)}</td></tr>`:''}</table>`;
  };
  ['#dPct','#dRs'].forEach(s => $(s).oninput = prev); const di = $('#dInteira'); if (di) di.onchange = prev; prev();
  $('#dCanc').onclick = fecharModal;
  const salvar = async (ajNovo, desc) => {
    const c2 = calcFatura(cli, f.cemig, ajNovo, f.competencia);
    const reg = {em:new Date().toISOString(), descricao: desc, motivo: $('#dMot')?.value.trim()||'', de: f.calc.valorAPagar, para: c2.valorAPagar};
    fecharModal();
    const base = {...f, ajuste: ajNovo, descontosAplicados: [...(f.descontosAplicados||[]), reg]};
    S.faturas[f.id] = base;
    await regerarPdf(base, true);
    toast(`${cli.nome}: novo valor ${brl(c2.valorAPagar)}`);
  };
  $('#dOk').onclick = () => { const n = novoAjuste(); salvar(n, descricao(n)); };
  const tirar = $('#dTirar'); if (tirar) tirar.onclick = () => { const n = {...aj}; ['desconto','outrosDescontos','descontoCobranca','contaInteira'].forEach(k=>delete n[k]); salvar(n, 'Voltou ao normal'); };
}

/* ===== Permutas ===== */
function telaPermutas(v){
  const ps = listaClientes().filter(c=>c.tipo==='permuta');
  const grupos = {};
  for (const c of ps){ const k = (c.permuta?.grupo||'').trim().toLowerCase() || ('_'+c.id); (grupos[k] = grupos[k] || []).push(c); }
  v.innerHTML += `<div class="cab"><h1>Permutas</h1><button class="btn" id="novoIA">${ic('ia')} Nova permuta com IA</button></div>
  <div class="dica">Cada permuta tem um limite por mês. O sistema soma o que a Seltec forneceu (energia compensada + taxas, e a conta Cemig se a Seltec pagar) e compara com o limite. O que passar vira cobrança, com o desconto combinado. UCs do mesmo grupo dividem um único limite.</div>
  ${Object.values(grupos).map(membros => {
    const c = membros[0], p = c.permuta||{}, kwh = p.base==='kwh', fmt = x => kwh ? fmtN(x)+' kWh' : brl(x);
    const fs = membros.flatMap(m => faturasDoCliente(m.id));
    const meses = [...new Set(fs.map(f=>f.competencia))].sort();
    const linhas = meses.map(m => { const doMes = fs.filter(f=>f.competencia===m);
      const usado = r2(doMes.reduce((s,f)=>s+(f.calc?.usoMedida||0),0)); const lim = doMes[0].calc?.limiteTotal ?? doMes[0].calc?.limite ?? 0;
      return {m, usado, lim, saldo: r2(lim-usado), cobrar: r2(doMes.reduce((s,f)=>s+(f.calc?.valorAPagar||0),0)), sts: doMes.map(f=>f.status)}; });
    const tot = k => r2(linhas.reduce((s,l)=>s+l[k],0));
    const titulo = membros.length > 1 ? `Grupo ${esc(p.grupo)}` : esc(c.nome);
    return `<section class="card perm">
      <div class="lin"><div><b>${titulo}</b><small>${membros.length>1?membros.map(m=>esc(m.nome)).join(' · ')+' · ':''}${esc(p.contrapartida||'contrapartida não informada')}</small></div>
        <div class="acoes" style="margin:0">${membros.map(m=>`<button class="btn sec" data-ed="${m.id}">${membros.length>1?esc(m.nome.split(' ')[0])+'…':'Regras'}</button>`).join('')}</div></div>
      <div class="regras"><span>Limite: <b>${fmt(Number(p.limite)||0)}</b>/mês</span><span>Energia a ${p.valoracao==='desconto'?`tarifa com ${c.desconto??30}% de desconto`:'tarifa cheia'}</span>
      <span>Apuração ${p.apuracao==='acumulada'?'acumulada':'mês a mês'}</span>${p.semCobranca?'<span>Só acompanhamento, sem cobrança</span>':`<span>Excedente com ${Number(p.descontoExcedente)||0}% de desconto</span>`}${p.incluirContaCemig?'<span>Inclui a conta Cemig paga pela Seltec</span>':''}</div>
      ${linhas.length ? `<div class="tabwrap"><table class="tab"><thead><tr><th>Mês</th><th>Utilizado</th><th>Limite</th><th>Saldo do mês</th><th>A cobrar</th><th>Status</th></tr></thead><tbody>
        ${linhas.map(l=>`<tr><td>${compCurta(l.m)}</td><td>${fmt(l.usado)}</td><td>${fmt(l.lim)}</td><td class="${l.saldo<0?'neg':'pos'}">${fmt(l.saldo)}</td><td>${brl(l.cobrar)}</td><td>${[...new Set(l.sts)].map(chip).join(' ')}</td></tr>`).join('')}
        </tbody><tfoot><tr><td>Total</td><td>${fmt(tot('usado'))}</td><td>${fmt(tot('lim'))}</td><td class="${tot('saldo')<0?'neg':'pos'}">${fmt(tot('saldo'))}</td><td>${brl(tot('cobrar'))}</td><td></td></tr></tfoot></table></div>`
      : '<p class="muted">Nenhum mês lançado ainda.</p>'}
      ${p.regraTexto?`<p class="small"><b>Acordo:</b> ${esc(p.regraTexto)}</p>`:''}
      ${p.formulaUso||p.formulaCobranca?`<p class="muted small">Regra própria${p.formulaUso?` · uso = <code>${esc(p.formulaUso)}</code>`:''}${p.formulaCobranca?` · cobrança = <code>${esc(p.formulaCobranca)}</code>`:''}</p>`:''}
      ${c.testeCadastro?`<p class="small ${c.testeCadastro.ok?'ok':'neg'}">${ic(c.testeCadastro.ok?'checkc':'alerta')} Teste do cadastro em ${new Date(c.testeCadastro.em).toLocaleDateString('pt-BR')}: ${c.testeCadastro.ok?'cálculos conferidos':'havia diferença nos cálculos'}</p>`:''}
      ${c.obs?`<p class="muted small">${esc(c.obs)}</p>`:''}
    </section>`; }).join('') || '<div class="vazio">Nenhum cliente de permuta. Em <a href="#clientes">Clientes</a>, marque o tipo "Permuta" e defina as regras.</div>'}`;
  $$('[data-ed]', v).forEach(b => b.onclick = () => editarCliente(S.clientes[b.dataset.ed]));
  $('#novoIA').onclick = () => cadastroIA();
}

/* ===== Reembolso ao Jomar ===== */
// Contas e despesas que o Jomar pagou do bolso; a Seltec devolve em lotes ("reembolsos").
const REEMB_DESDE = () => S.cfg.reembolsoDesde || '2026-11-01';
const reembItens = () => Object.values(S.reembolsos||{});
const reembAbertos = () => reembItens().filter(i => !i.loteId).sort((a,b)=>(a.vencimento||'9').localeCompare(b.vencimento||'9'));
const nomeReemb = i => (i.clienteId && S.clientes[i.clienteId]?.nome) || i.descricao || '—';
const novoIdReemb = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
async function gravarReemb(col, d){ S[col][d.id] = d; await gravar(col, d.id, d); }
async function apagarReemb(col, id){ delete S[col][id]; await apagar(col, id); }
function contaJaLancada(f){
  const v = f.cemig?.total||0, dv = f.cemig?.vencimento;
  return reembItens().some(i => i.contaRef === f.id || (i.clienteId && i.clienteId === f.clienteId && Math.abs((i.valor||0) - v) < 0.05
    && (!i.vencimento || !dv || Math.abs(new Date(i.vencimento) - new Date(dv)) < 25*864e5)));
}
function sugestoesReembolso(){
  const desde = REEMB_DESDE();
  return todasContas().filter(f => S.clientes[f.clienteId]?.reembolsoJomar === 'sim' && f.status !== 'cancelada' && (f.cemig?.total||0) > 0
      && (f.cemig?.vencimento||'') >= desde && !['retida','processando'].includes(f.situacaoCemig) && !contaJaLancada(f))
    .sort((a,b) => a.cemig.vencimento.localeCompare(b.cemig.vencimento));
}
const itemDeConta = f => ({ id:novoIdReemb('r'), clienteId:f.clienteId, descricao:S.clientes[f.clienteId]?.nome||'', vencimento:f.cemig.vencimento,
  valor:r2(f.cemig.total), competencia:f.competencia||'', contaRef:f.id, origem:'conta', loteId:null, criadoEm:new Date().toISOString() });

function telaReembolsos(v){
  const abertos = reembAbertos(), sug = sugestoesReembolso();
  const lotes = Object.values(S.reembolsoLotes||{}).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const soma = arr => r2(arr.reduce((s,x)=>s+x,0));
  const totAb = soma(abertos.map(i=>i.valor||0)), totSug = soma(sug.map(f=>f.cemig.total));
  const cls = listaClientes();
  const grupos = [['branco','A confirmar', cls.filter(c=>!c.reembolsoJomar)], ['sim','Entram no reembolso', cls.filter(c=>c.reembolsoJomar==='sim')], ['nao','Não reembolsam', cls.filter(c=>c.reembolsoJomar==='nao')]];
  const ult = lotes[0];
  const linhaItem = (i, editavel) => `<div class="venc-item ${editavel?'':'ok'}"><span class="quem"><b>${esc(nomeReemb(i))}</b><small>${i.vencimento?`vence ${isoParaBR(i.vencimento)}`:'sem vencimento'}${i.clienteId && i.descricao && !semAcento(nomeReemb(i)).toLowerCase().includes(semAcento(i.descricao).toLowerCase().trim())?` · na planilha: ${esc(i.descricao)}`:''}${i.obs?` · ${esc(i.obs)}`:''}</small></span>
      <span class="v ${i.valor<0?'pos':''}">${brl(i.valor)}</span>${editavel?`<span class="acoes" style="margin:0"><button class="mini-btn" data-red="${i.id}" aria-label="Editar">${ic('editar')}</button><button class="mini-btn" data-rdel="${i.id}" aria-label="Remover">${ic('lixo')}</button></span>`:''}</div>`;
  v.innerHTML += `<div class="cab"><h1>Reembolso ao Jomar</h1>
    <div class="acoes" style="margin:0"><button class="btn sec" id="rAdd">${ic('mais')} Lançar despesa</button><button class="btn" id="rPagar" ${abertos.length?'':'disabled'}>${ic('check')} Registrar reembolso</button></div></div>
  <p class="muted small">Contas Cemig e despesas que o Jomar pagou do bolso e a Seltec devolve para ele. Em cada cliente, marque se a conta dele entra no reembolso.</p>
  <div class="kpis">
    <div class="kpi alerta-kpi"><small>A reembolsar ao Jomar</small><b>${brl(totAb)}</b><span>${abertos.length} lançamento${abertos.length===1?'':'s'} em aberto</span></div>
    <div class="kpi"><small>Contas novas para incluir</small><b>${brl(totSug)}</b><span>${sug.length} conta${sug.length===1?'':'s'} Cemig de clientes marcados</span></div>
    <div class="kpi"><small>${ic('check')} Último reembolso</small><b>${ult?brl(ult.total):'—'}</b><span>${ult?`${isoParaBR(ult.data)}${ult.forma?' · '+esc(ult.forma):''}`:'nenhum ainda'}</span></div>
    <div class="kpi"><small>Clientes a confirmar</small><b>${grupos[0][2].length}</b><span>sem marcação de reembolso</span></div>
  </div>
  <section class="card"><h2>Contas Cemig para incluir <span class="n">${sug.length}</span></h2>
    ${sug.length ? `<p class="small">Contas de clientes marcados com "Reembolso ao Jomar" com vencimento a partir de ${isoParaBR(REEMB_DESDE())} que ainda não estão na lista.</p>
      ${sug.map(f => `<div class="venc-item"><span class="quem"><b>${esc(S.clientes[f.clienteId]?.nome||'?')}</b><small>${f.competencia?compLabel(f.competencia)+' · ':''}vence ${isoParaBR(f.cemig.vencimento)} · ${cemigPaga(f)?'Cemig paga':'Cemig em aberto'}</small></span><span class="v">${brl(f.cemig.total)}</span><button class="mini-btn" data-inc="${esc(f.id)}">${ic('mais')} Incluir</button></div>`).join('')}
      <div class="acoes"><button class="btn sec" id="rIncTodas">Incluir todas (${brl(totSug)})</button></div>`
      : `<p class="ok">${ic('checkc')} Nenhuma conta nova de cliente marcado.</p>`}
  </section>
  <section class="card"><h2>Em aberto: a Seltec deve ao Jomar <span class="n">${abertos.length}</span></h2>
    ${abertos.length ? abertos.map(i => linhaItem(i, true)).join('') + `<div class="venc-cab tot-reemb"><b>Total</b><span></span><span class="tot">${brl(totAb)}</span></div>`
      : `<p class="ok">${ic('checkc')} Nada a reembolsar no momento.</p>`}
  </section>
  <section class="card"><h2>Reembolsos feitos <span class="n">${lotes.length}</span></h2>
    ${lotes.length ? lotes.map(l => { const its = reembItens().filter(i=>i.loteId===l.id).sort((a,b)=>(a.vencimento||'9').localeCompare(b.vencimento||'9'));
      return `<details><summary><b>${isoParaBR(l.data)}</b>${l.forma?` · ${esc(l.forma)}`:''} · ${its.length} lançamento${its.length===1?'':'s'} · <b>${brl(l.total)}</b></summary>
        ${l.obs?`<p class="small">${esc(l.obs)}</p>`:''}${its.map(i => linhaItem(i, false)).join('')}
        <div class="acoes"><button class="btn sec mini" data-desf="${l.id}">Desfazer este reembolso</button></div></details>`; }).join('')
      : '<p class="muted">Nenhum reembolso registrado.</p>'}
  </section>
  <section class="card"><h2>Quem entra no reembolso</h2>
    <p class="small">"Sim" quer dizer que o Jomar paga a conta Cemig desse cliente e a Seltec devolve. As contas novas desses clientes aparecem em "Contas Cemig para incluir".</p>
    ${grupos.map(([k, tit, arr]) => `<details ${k==='branco'?'open':''}><summary><b>${tit}</b> · ${arr.length}</summary>
      ${arr.length ? `<ul class="lista">${arr.map(c => `<li class="lin"><span><b>${esc(c.nome)}</b><span>${c.usina?'Usina · ':''}paga a Cemig: ${esc(limpaPagador(c.pagadorCemig)||'não informado')}</span></span>
        <select class="sel-reemb" data-mr="${c.id}" aria-label="Reembolso de ${esc(c.nome)}">${[['','A confirmar'],['sim','Sim'],['nao','Não']].map(([o,t])=>`<option value="${o}" ${(c.reembolsoJomar||'')===o?'selected':''}>${t}</option>`).join('')}</select></li>`).join('')}</ul>` : '<p class="muted small">Ninguém.</p>'}</details>`).join('')}
  </section>`;

  $$('[data-inc]', v).forEach(b => b.onclick = async () => { b.disabled = true; const f = sug.find(x=>x.id===b.dataset.inc); if (!f) return;
    await gravarReemb('reembolsos', itemDeConta(f)); toast('Conta incluída no reembolso'); render(); });
  const it = $('#rIncTodas'); if (it) it.onclick = async () => { it.disabled = true; for (const f of sug) await gravarReemb('reembolsos', itemDeConta(f)); toast(`${sug.length} contas incluídas`); render(); };
  $$('[data-rdel]', v).forEach(b => b.onclick = async () => { const i = S.reembolsos[b.dataset.rdel];
    if (await confirmar(`Remover "${nomeReemb(i)}" (${brl(i.valor)}) da lista de reembolso?`, 'Remover')){ await apagarReemb('reembolsos', i.id); toast('Removido'); render(); } });
  $$('[data-red]', v).forEach(b => b.onclick = () => editarItemReemb(S.reembolsos[b.dataset.red]));
  $('#rAdd').onclick = () => editarItemReemb(null);
  $('#rPagar').onclick = () => registrarReembolso();
  $$('[data-desf]', v).forEach(b => b.onclick = async () => { const l = S.reembolsoLotes[b.dataset.desf];
    if (!await confirmar(`Desfazer o reembolso de ${isoParaBR(l.data)} (${brl(l.total)})? Os lançamentos voltam para "em aberto".`, 'Desfazer')) return;
    for (const i of reembItens().filter(i=>i.loteId===l.id)) await gravarReemb('reembolsos', {...i, loteId:null});

/* ===== Cadastro de permuta com IA ===== */
const REGRAS_IA = () => `Você ajuda a Seltec Energia Solar (Teófilo Otoni, MG) a cadastrar clientes de PERMUTA de energia solar.
Como funciona: a Seltec injeta créditos de energia solar na conta Cemig do cliente. Num cliente normal, ele paga a energia compensada com desconto (padrão 30%) mais as taxas da conta Cemig. Na permuta, o cliente paga em produtos/serviços (propaganda, serviços etc.) até um limite combinado; o que passar do limite pode ser cobrado.

O sistema calcula cada mês assim (modelo padrão):
- valorEnergia = kwh × tarifa (ou × tarifaDesc se valoracao = "desconto")
- utilizado (R$) = valorEnergia + taxas (se incluirTaxas) + contaCemig (se incluirContaCemig)
- base "reais": excedente = max(0, utilizado − limite). base "kwh": compara o consumo do mês (kWh) com o limite em kWh; excedente (R$) = max(0, consumo − limite) × tarifa × (1 − desconto)
- valorAPagar = excedente × (1 − descontoExcedente/100); se semCobranca = true, valorAPagar = 0
- apuracao "acumulada": soma limites e usos desde o início; cobra só o que passar no acumulado
- grupo: UCs com o mesmo nome de grupo dividem um único limite
Quando o acordo NÃO cabe nesse modelo, use fórmulas próprias (aritmética simples):
- formulaUso: substitui o cálculo de "utilizado" (em R$; ou em kWh se base = "kwh")
- formulaCobranca: substitui o cálculo de valorAPagar (o sistema aplica max(0, …))
Variáveis: ${Object.entries(VARS_FORMULA).map(([k,v])=>`${k} = ${v}`).join('; ')}. Funções: min, max, abs, arred(x,2). Operadores + - * / e parênteses. Use ponto decimal.

Cadastros parecidos que já existem: Cocobeach (limite R$ 500/mês, apuração acumulada, 20% de desconto no excedente, inclui a conta Cemig paga pela Seltec); Lula Guedes (limite 500 kWh/mês); Rádio e TV Imigrantes (grupo "Imigrantes", R$ 3.500/mês divididos entre duas UCs); Aristeu (só acompanhamento: paga a Cemig e abate em serviços, semCobranca).

Sua tarefa: ler o que o usuário contar sobre o acordo e montar o cadastro. Se faltar algo essencial (nome, número da UC, limite ou como cobrar o excedente), pergunte, em no máximo 3 perguntas curtas. Não invente número de UC, telefone nem endereço: deixe vazio se não foi dito.
Também crie 2 ou 3 TESTES FICTÍCIOS que exercitem o acordo (um dentro do limite e um passando do limite). Para cada teste, invente uma conta (kwh, consumo, tarifa por volta de 1,17, taxas, contaCemig) e calcule VOCÊ MESMO, a partir do acordo descrito pelo usuário (não das fórmulas), quanto deve dar o "utilizado" e o "valorAPagar". Mostre a conta passo a passo.

Responda SOMENTE com um JSON neste formato:
{"pronto": true|false,
 "perguntas": ["..."],
 "resumo": "explicação curta e simples do acordo, em português, para o usuário confirmar",
 "cliente": {"nome":"","uc":"","instalacao":"","endereco":"","whatsapp":"","titularCemig":"","pagadorCemig":"","desconto":30,"inicioContrato":"AAAA-MM-DD ou vazio","obs":""},
 "permuta": {"contrapartida":"","base":"reais|kwh","limite":0,"valoracao":"cheia|desconto","apuracao":"mensal|acumulada","descontoExcedente":0,"incluirTaxas":true,"incluirContaCemig":false,"grupo":"","semCobranca":false,"formulaUso":"","formulaCobranca":"","regraTexto":"o acordo em uma ou duas frases"},
 "testes": [{"descricao":"","entrada":{"kwh":0,"consumo":0,"tarifa":1.17,"taxas":0,"contaCemig":0},"esperado":{"utilizado":0,"valorAPagar":0},"conta":"passo a passo"}]}
Com "pronto": false, mande só "perguntas" e o que já souber.`;

function rodarTestes(cli, testes){
  return (testes||[]).map(t => {
    const e = t.entrada || {};
    const cm = { kwhCompensado: Number(e.kwh)||0, consumo: Number(e.consumo ?? e.kwh)||0, tarifa: Number(e.tarifa)||0, taxas: Number(e.taxas)||0, total: Number(e.contaCemig)||0, kwhGD1: Number(e.kwh)||0, kwhGD2: 0 };
    let calc, erro = '';
    try { calc = calcPermuta(cli, cm, {}, [], 0); } catch(err){ erro = err.message; }
    const esp = t.esperado || {};
    const usoSis = calc ? (cli.permuta?.base==='kwh' ? calc.usoMedida : calc.utilizado) : null;
    const okUso = calc && esp.utilizado != null ? Math.abs(usoSis - Number(esp.utilizado)) <= 0.05 : true;
    const okVal = calc ? Math.abs(calc.valorAPagar - Number(esp.valorAPagar||0)) <= 0.05 : false;
    return { ...t, sistema: calc ? {utilizado: usoSis, valorAPagar: calc.valorAPagar} : null, erro, ok: !erro && okUso && okVal };
  });
}

function escolherPasta(campo){
  const pilha = [];
  abrirModal(`<h3>Escolher pasta</h3>
    <div class="lin"><input id="qPasta" placeholder="Buscar pasta pelo nome"><button class="btn sec" id="bPasta">Buscar</button></div>
    <div id="caminho" class="muted small" style="margin:8px 0"></div><div id="rPasta"><p class="muted">Carregando…</p></div>
    <div class="acoes"><button class="btn sec" id="fPasta">Fechar</button></div>`);
  $('#fPasta').onclick = fecharModal;
  const mostrar = async (query, titulo) => {
    $('#rPasta').innerHTML = '<p class="muted">Carregando…</p>';
    $('#caminho').innerHTML = pilha.length ? `<a href="#" id="voltar">${ic('voltar')} voltar</a> · ${pilha.map(p=>esc(p.nome)).join(' / ')}` : esc(titulo||'');
    const v = $('#voltar'); if (v) v.onclick = e => { e.preventDefault(); pilha.pop(); pilha.length ? abrir(pilha.pop()) : inicio(); };
    try {
      const r = await drive('search_files', {query, excludeContentSnippets:true, pageSize:50});
      const fs = (payloadDe(r)||{}).files || [];
      $('#rPasta').innerHTML = fs.length ? `<ul class="lista">${fs.map(f=>`<li class="lin"><span><b>${ic('pasta')} ${esc(f.title)}</b><span>${esc(f.owner||'')}</span></span>
        <span class="acoes" style="margin:0"><button class="btn sec" data-abrir="${f.id}" data-nome="${esc(f.title)}">Abrir</button><button class="btn" data-esc="${f.id}" data-nome="${esc(f.title)}">Escolher</button></span></li>`).join('')}</ul>`
        : '<p class="muted">Nenhuma pasta encontrada.</p>';
      $$('[data-abrir]').forEach(b => b.onclick = () => abrir({id:b.dataset.abrir, nome:b.dataset.nome}));
      $$('[data-esc]').forEach(b => b.onclick = () => { fecharModal(); salvarDrive({[campo]: {id:b.dataset.esc, nome:b.dataset.nome}}); });
    } catch(e){ $('#rPasta').innerHTML = `<div class="alerta">${esc(msgDrive(e))}</div>`; }
  };
  const abrir = p => { pilha.push(p); mostrar(`parentId = '${p.id}' and mimeType = 'application/vnd.google-apps.folder'`); };
  const inicio = () => mostrar(`mimeType = 'application/vnd.google-apps.folder' and (sharedWithMe = true or parentId = 'root')`, 'Pastas compartilhadas com você e do seu Drive');
  $('#bPasta').onclick = () => { const q = $('#qPasta').value.trim().replace(/'/g,"\\'"); pilha.length = 0; q ? mostrar(`mimeType = 'application/vnd.google-apps.folder' and title contains '${q}'`, `Resultado para "${q}"`) : inicio(); };
  $('#qPasta').onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); $('#bPasta').click(); } };
  inicio();
}

# Seltec Energia Solar · Faturas e Permutas

## O que é
A Seltec Energia Solar (Teófilo Otoni, MG; CNPJ ${S.cfg.cnpj}) tem usinas solares (UFVs) que geram créditos de energia na Cemig. Esses créditos são injetados nas contas Cemig de clientes. Todo mês a Seltec:
1. pega a conta Cemig de cada cliente (o Grok baixa os PDFs para o Google Drive);
2. calcula quanto o cliente deve pagar à Seltec pela energia compensada;
3. gera a fatura Seltec em PDF, com a conta Cemig anexada;
4. envia ao cliente pelo WhatsApp e, depois de enviada, arquiva os arquivos no Drive.

A plataforma (uma página publicada como artefato do Claude) faz tudo isso. Esta skill explica as regras para que uma nova conta do Claude assuma o trabalho.

## Termos
- **UC (unidade consumidora)**: número da conta Cemig, ex.: 12.808.148.018-48. É a chave de cada cliente (id interno = "uc" + só os dígitos).
- **Nº da instalação**: outro número da Cemig, ex.: 3015809257. Os arquivos do Grok usam esse número no nome.
- **Energia compensada (kWh)**: soma das linhas "Energia compensada GD I" e "GD II" da conta Cemig. GD II compensa menos (sobra um custo na conta Cemig).
- **Tarifa Cemig**: preço unitário da linha "Custo de Disponibilidade" ou, se não houver, da linha "Energia Elétrica" (tarifa cheia com impostos, ex.: 1,16099569).
- **Taxas ("Fatura Cemig*")**: soma das linhas positivas da conta que não são energia compensada nem "Energia SCEE": custo de disponibilidade ou consumo mínimo ("Energia Elétrica"), iluminação pública, multas, juros.

## Cálculo da fatura de venda (conferido com faturas reais)
- tarifa com desconto = tarifa × (1 − desconto), arredondada em 9 casas (desconto padrão 30%)
- energia = kWh compensados × tarifa com desconto (2 casas)
- total = energia + taxas − outros descontos
- cliente pagaria = kWh × tarifa + taxas; economia = pagaria − total

Conferências que bateram centavo por centavo:
- Radeck 1, out/26: 10.720 kWh × 0,822928813 = 8.821,80 + 134,61 = **R$ 8.956,41**

## Cálculo das permutas
Na permuta o cliente paga em produtos ou serviços até um limite. Por mês:
- valor da energia = kWh × tarifa (cheia) ou × tarifa com desconto, conforme o campo "valoracao"
- utilizado = valor da energia + taxas (se incluirTaxas) + total da conta Cemig (se incluirContaCemig, quando a Seltec paga a conta)
- base "reais": excedente = max(0, utilizado − limite); base "kwh": compara o consumo do mês com o limite em kWh e cobra o excedente × tarifa × (1 − desconto)
- a cobrar = excedente × (1 − descontoExcedente%); "semCobranca" = só acompanhamento, nunca cobra
- apuração "acumulada": soma limites e usos desde o início e cobra só o que passar no acumulado, descontando o que já foi cobrado
- grupo: UCs com o mesmo grupo dividem um limite (ex.: Rádio e TV Imigrantes)
- fórmulas próprias (formulaUso, formulaCobranca) para acordos fora do padrão. Só aritmética com as variáveis ${Object.keys(VARS_FORMULA).join(', ')} e as funções min, max, abs, arred. Nunca usar eval.

Todo cadastro de permuta feito pela IA passa por um **teste fictício**: a IA calcula 2 ou 3 casos a partir do acordo em palavras, o sistema calcula os mesmos casos com as regras cadastradas, e os dois precisam bater antes de salvar.

async function bytesDeAsset(id){ return await lerAsset(id); }
async function baixarBackup(botao){
  if (typeof JSZip === 'undefined'){ toast('Não consegui montar o .zip.', 'erro'); return; }
  const z = new JSZip(); const fs = Object.values(S.faturas); let n = 0, faltou = 0;
  const prog = t => { if (botao) botao.textContent = t; };
  for (const f of fs){
    prog(`Juntando PDFs… ${++n}/${fs.length}`);
    const sel = S.pdfMem.get(f.id) || (f.pdfId ? await bytesDeAsset(f.pdfId) : null);
    const cem = S.pdfMem.get('cemig_'+f.id) || (f.cemigPdfId ? await bytesDeAsset(f.cemigPdfId) : null);
    if (sel) z.file(`pdfs/${f.id}_seltec.pdf`, sel); else faltou++;
    if (cem) z.file(`pdfs/${f.id}_cemig.pdf`, cem);
  }
  if (S.cfg.logoId){ const l = await bytesDeAsset(S.cfg.logoId); if (l) z.file('logo.bin', l); }
  z.file('dados.json', JSON.stringify({tipo:'backup-seltec', versao:1, exportadoEm:new Date().toISOString(), clientes:S.clientes, faturas:S.faturas, contasCemig:S.contasCemig, reembolsos:S.reembolsos, reembolsoLotes:S.reembolsoLotes, cfg:S.cfg}, null, 1));
  z.file('LEIA-ME.txt', `Backup da plataforma Seltec · Faturas e Permutas\nGerado em ${new Date().toLocaleString('pt-BR')}\n${Object.keys(S.clientes).length} clientes, ${fs.length} faturas.\nPara restaurar: abra a plataforma, vá em Ajustes → Restaurar backup e escolha este arquivo .zip.`);
  prog('Compactando…');
  const blob = await z.generateAsync({type:'blob', compression:'DEFLATE'});
  const ok = await salvarArquivo(`backup-seltec-${new Date().toISOString().slice(0,10)}.zip`, blob);
  if (ok) toast(`Backup baixado: ${Object.keys(S.clientes).length} clientes, ${fs.length} faturas` + (faltou ? ` (${faltou} sem PDF guardado)` : ''));
}
async function restaurarBackup(arq){
  let dados, z = null;
  try {
    if (/\.zip$/i.test(arq.name)){ z = await JSZip.loadAsync(arq); const dj = z.file('dados.json'); if (!dj) throw new Error('sem dados.json'); dados = JSON.parse(await dj.async('string')); }
    else dados = JSON.parse(await arq.text());
  } catch(e){ toast('Arquivo de backup inválido.', 'erro'); return; }
  const cs = Object.values(dados.clientes||{}), fs = Object.values(dados.faturas||{}), ccs = Object.values(dados.contasCemig||{}), rs = Object.values(dados.reembolsos||{}), rls = Object.values(dados.reembolsoLotes||{});
  const comPdf = z ? Object.keys(z.files).filter(n=>n.startsWith('pdfs/')).length : 0;
  if (!await confirmar(`Restaurar ${cs.length} clientes, ${fs.length} faturas${ccs.length?`, ${ccs.length} contas Cemig`:''}${rs.length?` e ${rs.length} lançamentos de reembolso`:''}${comPdf?` com ${comPdf} PDFs`:''}? Registros com o mesmo código serão substituídos.${dados.cfg?' Os ajustes da empresa também serão restaurados.':''}`, 'Restaurar')) return;
  const aviso = document.createElement('div'); aviso.className = 'toast'; aviso.textContent = 'Restaurando…'; $('#toasts').appendChild(aviso);
  try {
    for (const c of cs) await gravarCliente(c);
    let i = 0;
    for (const f0 of fs){
      aviso.textContent = `Restaurando faturas… ${++i}/${fs.length}`;
      const f = {...f0};
      for (const [tipo, campo, chave] of [['seltec','pdfId', f.id], ['cemig','cemigPdfId','cemig_'+f.id]]){
        const arqPdf = z && z.file(`pdfs/${f.id}_${tipo}.pdf`);
        if (!arqPdf) continue;
        const bytes = await arqPdf.async('uint8array');
        if (S.assets){ try { const up = await S.assets.upload(new Blob([bytes],{type:'application/pdf'})); f[campo] = up.id; continue; } catch(e){} }
        S.pdfMem.set(chave, bytes); delete f[campo];
      }
      await gravarFatura(f);
    }
    let j = 0;
    for (const c of ccs){ aviso.textContent = `Restaurando contas Cemig… ${++j}/${ccs.length}`; S.contasCemig[c.id] = c; await gravar('contasCemig', c.id, c); }
    let k = 0;
    for (const [col, arr] of [['reembolsoLotes', rls], ['reembolsos', rs]]) for (const d of arr){ aviso.textContent = `Restaurando reembolsos… ${++k}/${rs.length+rls.length}`; S[col][d.id] = d; await gravar(col, d.id, d); }
    if (dados.cfg){
      const cfg = {...dados.cfg};
      const logo = z && z.file('logo.bin');
      if (logo && S.assets){ try { const b = await logo.async('uint8array'); const up = await S.assets.upload(new Blob([b], {type: b[0]===0x89?'image/png':'image/jpeg'})); cfg.logoId = up.id; } catch(e){ delete cfg.logoId; } }
      else delete cfg.logoId;
      await gravar('config','empresa', cfg); S.cfg = {...CFG_PADRAO, ...cfg};
    }
    toast(`Restaurado: ${cs.length} clientes, ${fs.length} faturas${ccs.length?`, ${ccs.length} contas Cemig`:''}`);
  } catch(e){ toast('A restauração parou no meio. Tente de novo com o mesmo arquivo.', 'erro'); }
  finally { aviso.remove(); render(); }
}

const SUPA = { url: 'https://wgcqmtssgqpebixxvlsk.supabase.co', chave: 'sb_publishable_3Fg-u9cmaUJGayw4mtZ1nQ_a-BEQzjp', bucket: 'arquivos' };

function criarDbSupabase(sb){
  const cache = {};            // colecao -> Map(path -> data)
  const ouvCol = {};           // colecao -> Set(callback)
  const ouvDoc = {};           // path -> Set(callback)
  const carregando = {};
  const colDe = p => p.split('/').slice(0, -1).join('/');
  const idDe = p => p.split('/').pop();
  const snapCol = col => ({ docs: [...(cache[col] || new Map()).entries()].map(([p, d]) => ({ id: idDe(p), exists: true, data: () => d })) });
  const snapDoc = p => { const d = cache[colDe(p)]?.get(p); return { id: idDe(p), exists: !!d, data: () => d }; };
  const avisar = p => { const c = colDe(p); (ouvCol[c] || []).forEach(f => f(snapCol(c))); (ouvDoc[p] || []).forEach(f => f(snapDoc(p))); };
  async function carregar(col){
    if (cache[col]) return; if (carregando[col]) return carregando[col];
    carregando[col] = (async () => {
      const m = new Map(); let de = 0;
      for (;;){
        const { data, error } = await sb.from('docs').select('path,data').eq('colecao', col).range(de, de + 999);
        if (error) throw { code: 'unavailable', message: error.message };
        data.forEach(r => m.set(r.path, r.data)); if (data.length < 1000) break; de += 1000;
      }
      cache[col] = m;
    })();
    try { await carregando[col]; } finally { delete carregando[col]; }
  }
  sb.channel('docs-tempo-real')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, ev => {
      const linha = ev.eventType === 'DELETE' ? ev.old : ev.new; if (!linha?.path) return;
      const col = linha.colecao || colDe(linha.path); if (!cache[col]) return;
      if (ev.eventType === 'DELETE') cache[col].delete(linha.path); else cache[col].set(linha.path, linha.data);
      avisar(linha.path);
    }).subscribe();
  const db = {
    collection(col){
      return {
        doc: id => db.doc(`${col}/${id}`),
        onSnapshot(next, erro){
          (ouvCol[col] = ouvCol[col] || new Set()).add(next);
          carregar(col).then(() => next(snapCol(col))).catch(e => erro && erro(e));
          return () => ouvCol[col].delete(next);
        }
      };
    },
    doc(path){
      const col = colDe(path);
      return {
        async set(data){
          const { error } = await sb.from('docs').upsert({ path, colecao: col, data, atualizado_em: new Date().toISOString() });
          if (error) throw { code: 'invalid_argument', message: error.message };
          (cache[col] = cache[col] || new Map()).set(path, data); avisar(path);
        },
        async delete(){
          const { error } = await sb.from('docs').delete().eq('path', path);
          if (error) throw { code: 'invalid_argument', message: error.message };
          cache[col]?.delete(path); avisar(path);
        },
        onSnapshot(next, erro){
          (ouvDoc[path] = ouvDoc[path] || new Set()).add(next);
          carregar(col).then(() => next(snapDoc(path))).catch(e => erro && erro(e));
          return () => ouvDoc[path].delete(next);
        }
      };
    }
  };
  return db;
}

function criarArquivosSupabase(sb){
  const extDe = t => ({ 'application/pdf': 'pdf', 'image/png': 'png', 'image/jpeg': 'jpg' })[t] || 'bin';
  return {
    async upload(blob, opts = {}){
      const tipo = opts.type || blob.type || 'application/pdf';
      const id = `${new Date().toISOString().slice(0, 7)}/${crypto.randomUUID()}.${extDe(tipo)}`;
      const { error } = await sb.storage.from(SUPA.bucket).upload(id, blob, { contentType: tipo, upsert: false });
      if (error) throw { code: 'upstream_error', message: error.message };
      return { id, url: null, sizeBytes: blob.size, contentType: tipo };
    },
    async delete(id){ const { error } = await sb.storage.from(SUPA.bucket).remove([id]); if (error) throw { code: 'upstream_error', message: error.message }; return { deleted: true }; },
    async list(){ return { assets: [], usage: {} }; }
  };
}

    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
    if (error){ msg.innerHTML = `<span class="neg">${error.message.includes('Invalid login') ? 'E-mail ou senha incorretos.' : esc(error.message)}</span>`; b.disabled = false; return; }
    location.reload();
  };
  const esq = document.getElementById('esqueci');
  if (esq) esq.onclick = async e => {
    e.preventDefault(); const email = f.email.value.trim();
    if (!email){ msg.innerHTML = '<span class="neg">Digite o seu e-mail acima e toque de novo em "Esqueci a senha".</span>'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msg.innerHTML = error ? `<span class="neg">${esc(error.message)}</span>` : '<span class="ok">Se o e-mail estiver cadastrado, chega um link para criar a nova senha.</span>';
  };
}

async function iniciarSupabase(){
  if (typeof supabase === 'undefined'){ S.aviso = 'Não consegui carregar o sistema de login. Verifique a internet.'; S.modo = 'local'; render(); return; }
  const sb = supabase.createClient(SUPA.url, SUPA.chave, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  S.sb = sb;
  const { data: { session } } = await sb.auth.getSession();
  if (/type=recovery/.test(location.hash) || sessionStorage.getItem('seltec-recuperar')){
    sessionStorage.setItem('seltec-recuperar', '1');
    if (session){ sessionStorage.removeItem('seltec-recuperar'); telaLogin(sb, 'nova-senha'); return; }
  }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') telaLogin(sb, 'nova-senha'); if (ev === 'SIGNED_OUT') location.reload(); });
  if (!session){ telaLogin(sb); return; }
  S.usuario = session.user.email;
  S.assets = criarArquivosSupabase(sb);
  S.lerAssetExterno = async id => { const { data, error } = await sb.storage.from(SUPA.bucket).download(id); if (error || !data) return null; return new Uint8Array(await data.arrayBuffer()); };
  S.downloads = null; S.mcp = null; S.sample = null;
  assinarDados(criarDbSupabase(sb));
  desenharTopo();
}
async function sairSupabase(){ if (S.sb) await S.sb.auth.signOut(); location.reload(); }

</script>
