<style>
:root{--verde:#b8540e;--verde2:#a04a20;--verde-cl:#fff1e3;--laranja:#f08420;--folha:#5a7a00;--lima:#a8cc38;--folha-cl:#f1f7e1;--ambar:#f08420;--ambar-esc:#a04a20;--fundo:#fbf8f4;--card:#fff;--txt:#2a1d14;--mut:#75675c;--borda:#eee3d8;--erro:#b42318;--r:14px}
@media (prefers-color-scheme:dark){:root{--fundo:#17130f;--card:#211b15;--txt:#f3ebe3;--mut:#b3a596;--borda:#3a2f25;--verde-cl:#3a2614;--verde2:#f5a65b;--folha:#b5d65a;--folha-cl:#26300f}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--fundo);color:var(--txt);font-size:15px;line-height:1.45}
a{color:var(--verde2)}
header{background:var(--card);color:var(--txt);padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--borda)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--laranja) 0%,var(--laranja) 70%,var(--lima) 70%,var(--lima) 100%)}
header .marca{display:flex;align-items:center;gap:10px;font-family:Lexend,Inter,sans-serif;font-weight:600;font-size:15px;color:var(--mut)}
header .marca img{height:36px;display:block}
header .marca .sep{width:1px;height:24px;background:var(--borda)}
@media (max-width:420px){header .marca .sub{display:none} header .marca .sep{display:none}}
#status{margin-left:auto;font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.pt{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}.pt.ok{background:#4ade80}.pt.aviso{background:var(--ambar)}
.wrap{display:flex;min-height:calc(100vh - 52px)}
#nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;width:190px;flex-shrink:0;border-right:1px solid var(--borda);background:var(--card)}
#nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--txt);font-weight:500}
#nav a .ic{width:20px;text-align:center}
#nav a.ativo{background:var(--verde-cl);color:var(--verde2);box-shadow:inset 3px 0 0 var(--laranja)}
@media (max-width:760px){#nav a.ativo{box-shadow:inset 0 3px 0 var(--laranja)}}
main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;padding-bottom:90px}
@media (max-width:760px){
  #nav{position:fixed;bottom:0;left:0;right:0;width:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--borda);z-index:6}
  #nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;flex:1}
  #nav a .ic{font-size:17px}
  main{padding:14px;padding-bottom:100px}
  html{scroll-padding-bottom:90px}

}
h1{font-family:Lexend,Inter,sans-serif;font-weight:600;font-size:23px;margin:0;letter-spacing:-.3px} h2{font-family:Lexend,Inter,sans-serif;font-weight:600;font-size:15px;margin:0 0 10px} h3{margin:0 0 10px;font-size:18px} h4{margin:16px 0 6px;font-size:14px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.n{background:var(--verde-cl);color:var(--verde2);border-radius:20px;padding:1px 9px;font-size:13px;font-weight:600;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn:hover:not(:disabled){filter:brightness(.93)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;min-height:42px}

.btn.whats{background:#1f9d55}
.btn.grande{width:100%;padding:14px;font-size:15px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.acoes select{min-height:42px}
select,input,textarea{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:9px 10px;width:100%}
textarea{resize:vertical}
input[type=color]{height:42px;padding:3px}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)} .sel select{width:auto}
.filtros{display:flex;gap:8px} .filtros select{width:auto}

.kpi{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--laranja)}

.kpi small{color:var(--mut);font-size:12px}.kpi b{font-size:20px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mut)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:760px){.grade2{grid-template-columns:1fr}}
.lista{list-style:none;padding:0;margin:0 0 12px} .lista li{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--borda)} .lista li span{font-size:13px;color:var(--mut)}
.ok{color:var(--folha)} .muted{color:var(--mut)} .small{font-size:12.5px}
.alerta{background:#fff7e6;border:1px solid #f5d38f;color:#7a4b00;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}

.dica{background:var(--folha-cl);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.vazio{text-align:center;color:var(--mut);padding:40px 10px}
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:2px dashed var(--laranja);border-radius:var(--r);padding:28px 16px;background:var(--verde-cl);cursor:pointer;margin-bottom:14px}
.drop.sobre{background:#ffe2c4} .drop span{font-size:13px;color:var(--mut);max-width:520px}
.lin{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lin small{display:block;color:var(--mut);font-size:12.5px}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--mut);cursor:pointer}
.item.erro{border-color:var(--erro)} .item.ok{border-color:var(--lima)}
.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;margin:12px 0}
@media (max-width:560px){.dados{grid-template-columns:1fr 1fr}}
.dados span{font-weight:600;font-size:14px} .dados small{display:block;font-weight:400;color:var(--mut);font-size:11.5px} .dados em{font-weight:400;font-style:normal;color:var(--mut);font-size:12px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px} @media (max-width:560px){.campos{grid-template-columns:1fr}}
.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)} .campo input,.campo select,.campo textarea{color:var(--txt)}
.larg{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:14px} .check input{width:auto}
fieldset{border:1px solid var(--borda);border-radius:10px;padding:12px} legend{font-weight:600;font-size:14px;padding:0 6px}
details{margin:8px 0} summary{cursor:pointer;color:var(--verde2);font-weight:600;font-size:14px;padding:6px 0}
.calc{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.calc td{padding:6px 4px;border-bottom:1px solid var(--borda)} .calc td:nth-child(2){color:var(--mut);font-size:12.5px} .calc td:last-child{text-align:right;white-space:nowrap}
.calc tr.tot td{font-weight:700;border-bottom:2px solid var(--verde2);font-size:15px} .calc tr.mut td{color:var(--mut)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;background:#eef;color:#334;white-space:nowrap}
.chip.verde{background:#dcf3e4;color:#14532d}.chip.azul{background:#e0ecff;color:#1d4ed8}.chip.amarelo{background:#fff1cc;color:#8a5a00}.chip.cinza{background:#eceeed;color:#555}.chip.roxo{background:#efe5ff;color:#5b21b6}
.fat .val{text-align:right;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.mini{font-size:12.5px;color:var(--mut);margin-top:6px}
.fat .acoes select{width:auto}
.perm .regras{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0} .perm .regras span{background:var(--fundo);border-radius:8px;padding:4px 9px;font-size:12.5px}
.tabwrap{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:520px}
.tab th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:6px;border-bottom:1px solid var(--borda)}
.tab td{padding:7px 6px;border-bottom:1px solid var(--borda)} .tab tfoot td{font-weight:700;border-bottom:0}
.neg{color:var(--erro)} .pos{color:var(--folha)}
.busca{margin-bottom:12px}
.grade-cli{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cli{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;margin:0}
.cli small{color:var(--mut);font-size:12.5px} .falta{color:var(--ambar-esc)}
.pasta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda)} .pasta small{display:block;color:var(--mut);font-size:12px} .pasta b{display:block}
.estado-drive{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.lista.drive li{flex-direction:row} .lista.drive .check{align-items:flex-start} .lista.drive .check>span{display:flex;flex-direction:column} .lista.drive .check input{margin-top:4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow-y:auto;margin:10px 0}
.bolha{padding:10px 12px;border-radius:12px;font-size:14px;max-width:92%} .bolha p{margin:0 0 6px} .bolha ul{margin:4px 0;padding-left:18px}
.bolha.eu{align-self:flex-end;background:var(--verde);color:#fff} .bolha.ia{align-self:flex-start;background:var(--fundo);border:1px solid var(--borda)}
.prop{margin-top:12px;border-color:var(--verde2)} .teste{border:1px solid var(--borda);border-radius:10px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.teste.ok{border-color:var(--lima)} .teste.falhou{border-color:var(--erro)} code{background:var(--fundo);padding:1px 5px;border-radius:5px;font-size:12.5px}
.filtros-dash{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px} .filtros-dash select{width:auto} .filtros-dash .busca{flex:1;min-width:220px;margin:0} .filtros-dash input[type=month]{width:auto}
.kpi.alerta-kpi b{color:var(--erro)}
.st-bom{fill:#0ca30c;background:#0ca30c} .st-aviso{fill:#fab219;background:#fab219} .st-critico{fill:#d03b3b;background:#d03b3b}
.legenda{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap} .legenda i,.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.graf{position:relative} .graf svg{width:100%;height:auto;display:block} .graf .grade{stroke:var(--borda);stroke-width:1} .graf .eixo{fill:var(--mut);font-size:11px;font-family:Inter,sans-serif} .graf .alvo{cursor:pointer}
.tip{position:absolute;top:0;width:170px;background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.hbars{display:flex;flex-direction:column;gap:6px} .hbar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;background:none;border:0;padding:4px 0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.hbar .nome{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbar .trilho{height:10px;background:var(--fundo);border-radius:5px;overflow:hidden} .hbar .barra{display:block;height:100%;background:#e06f12;border-radius:5px}
.hbar .val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums} .hbar .val small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.btn.mini{min-height:34px;padding:6px 11px;font-size:13px}
.dias-chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dia-chip{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 8px;border-radius:10px;border:1px solid var(--borda);text-decoration:none;color:var(--txt)} .dia-chip b{font-size:16px} .dia-chip span{font-size:11px;color:var(--mut)}
.dia-chip.hoje{border-color:var(--verde2);background:var(--verde-cl)} .dia-chip.passou{opacity:.6}
.venc-dia{border-top:1px solid var(--borda);padding:10px 0;scroll-margin-top:70px} .venc-cab{display:flex;gap:10px;align-items:baseline;margin-bottom:6px} .venc-cab span{color:var(--mut);font-size:12.5px} .venc-cab .tot{margin-left:auto;color:var(--txt);font-weight:600}
.venc-dia.hoje .venc-cab b{color:var(--verde2)}
.venc-item{display:flex;align-items:center;gap:8px;padding:7px 0;flex-wrap:wrap} .venc-item .quem{flex:1;min-width:140px;display:flex;flex-direction:column} .venc-item .quem small{color:var(--mut);font-size:12px}
.venc-item .v{font-weight:600;font-variant-numeric:tabular-nums} .venc-item.ok .quem,.venc-item.ok .v{opacity:.55} .venc-item.atrasado .v{color:var(--erro)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap} .tag.rec{background:#dcf3e4;color:#14532d} .tag.cem{background:#e0ecff;color:#1d4ed8}
.mini-btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--verde2);color:var(--verde2);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}
.mini-btn.feito{background:var(--folha-cl);color:var(--folha);border-color:transparent}
.col-bot{display:flex;gap:6px;flex-wrap:wrap}
.hist-mes h4{margin:14px 0 4px;text-transform:capitalize}
.chip.vermelho{background:#fde2e1;color:#b42318}
.pend details{margin:4px 0}
.tip[hidden]{display:none}
body.sem-app header, body.sem-app .wrap{display:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px} #login[hidden]{display:none}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--laranja)} .login-logo{height:56px;align-self:flex-start} .login-card h1{font-size:21px}
#status .usr{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} @media (max-width:520px){#status .usr{display:none}}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#nav a .ic .ico{width:20px;height:20px;vertical-align:middle} #nav a .ic{opacity:1;display:flex;justify-content:center}
.tit-ic{display:flex;align-items:center;gap:8px} .tit-ic .ico{color:var(--laranja)}
.kpi small .ico{width:14px;height:14px} .ok .ico{vertical-align:-.25em}
.x .ico{width:20px;height:20px}
.desc-extra{color:var(--folha);font-weight:600}
.venc-topo{flex-wrap:wrap} .nav-mes{flex-wrap:nowrap}
.lista li.lin{flex-direction:row;justify-content:space-between;align-items:center} .lista li.lin>span:first-child{display:flex;flex-direction:column} .lista li.lin>span:first-child>span{font-size:13px;color:var(--mut)}
.logo{display:flex;align-items:center;gap:12px;margin-top:6px} .logo img{max-height:56px;max-width:180px;border-radius:6px;background:#fff;padding:4px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;z-index:20;overflow-y:auto}
#modal[hidden]{display:none}
#modal .card{width:100%;max-width:640px;margin:auto 0}
#modal textarea{font-size:13px}

.toast{background:#2b1d12;color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)} .toast.erro{background:var(--erro)}
.reemb-tag{color:var(--verde2);font-weight:600}
.sel-reemb{width:auto;flex:0 0 auto;max-width:50%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--borda);border-radius:8px;background:var(--card);color:var(--txt);min-height:34px}
.tot-reemb{border-top:1px solid var(--borda);margin-top:6px;padding-top:8px}
.venc-item .v.pos{color:var(--folha)}
@media (max-width:760px){#nav a{font-size:9.5px;padding:6px 2px}}

<script>
/* ===== Núcleo: utilidades, leitura da conta Cemig, cálculos, Pix ===== */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_ABR = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

const r2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
const num = s => {
  if (s === null || s === undefined || s === '') return null;
  if (typeof s === 'number') return s;
  const t = String(s).replace(/R\$\s*/,'').trim();
  if (!/^-?[\d.]*,?\d*$/.test(t)) return null;
  const v = parseFloat(t.replace(/\./g,'').replace(',','.'));
  return isNaN(v) ? null : v;
};
const brl = v => (v === null || v === undefined || isNaN(v)) ? '—' :
  Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN = (v, d=0) => (v === null || v === undefined || isNaN(v)) ? '—' :
  Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d});
const soDigitos = s => String(s||'').replace(/\D/g,'');
const compLabel = c => { if(!c) return '—'; const [y,m]=c.split('-'); return `${MESES[+m-1]}/${y.slice(2)}`; };
const compCurta = c => { if(!c) return '—'; const [y,m]=c.split('-'); return `${MES_ABR[+m-1].toLowerCase()}/${y.slice(2)}`; };
const isoParaBR = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const brParaIso = d => { const m=String(d||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:''; };

/* Agrupa os textos do PDF em linhas, na ordem visual */
async function extrairLinhasPdf(bytes){
  const doc = await pdfjsLib.getDocument({data: bytes.slice(0), isEvalSupported:false, useSystemFonts:true, verbosity:0}).promise;
  const paginas = [];
  for (let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    const rows = {};
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      const k = Object.keys(rows).find(k => Math.abs(k - y) <= 1) ?? y;
      (rows[k] = rows[k] || []).push([it.transform[4], it.str.trim()]);
    }
    const linhas = Object.keys(rows).map(Number).sort((a,b)=>b-a)
      .map(y => rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' | '));
    paginas.push(linhas);
  }
  return paginas;
}

/* Lê os dados da conta da Cemig a partir das linhas */
function lerContaCemig(paginas){
  const ehCemig = l => /NOTA FISCAL DE ENERGIA|CEMIG DISTRIBUI/i.test(l.join(' '));
  const idx = paginas.map((l,i)=>ehCemig(l)?i:-1).filter(i=>i>=0);
  if (!idx.length) throw new Error('Não encontrei uma conta da Cemig neste PDF.');
  const linhas = idx.flatMap(i => paginas[i]);
  const txt = linhas.join('\n');
  const r = { paginasCemig: idx, avisos: [] };

  const ref = txt.match(/\b(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\/(\d{4})\s*\|\s*(\d{2}\/\d{2}\/\d{4})\s*\|\s*(-?[\d.]+,\d{2})/);
  if (ref){
    r.competencia = `${ref[2]}-${String(MES_ABR.indexOf(ref[1])+1).padStart(2,'0')}`;
    r.vencimento = brParaIso(ref[3]);
    r.total = num(ref[4]);
  } else r.avisos.push('Não achei mês de referência / vencimento / valor.');

  const ucBloco = txt.match(/UNIDADE CONSUMIDORA[\s\S]{0,200}?\b(\d{1,3}(?:\.\d{3})+-\d{2})\b/i);
  const ucQualquer = txt.match(/\b(\d{1,3}(?:\.\d{3}){2,}-\d{2})\b/);
  r.uc = (ucBloco || ucQualquer || [])[1] || '';
  if (!r.uc) r.avisos.push('Não achei o número da unidade consumidora.');

  const leit = txt.match(/(\d{2}\/\d{2})\s*\|\s*(\d{2}\/\d{2})\s*\|\s*(\d{1,3})\s*\|\s*(\d{2}\/\d{2})/);
  if (leit){ r.leituraAnterior = leit[1]; r.leituraAtual = leit[2]; r.dias = +leit[3]; r.proximaLeitura = leit[4]; }
  const classe = txt.match(/\b(Monof[aá]sico|Bif[aá]sico|Trif[aá]sico)\b/i);
  r.classe = classe ? classe[1][0].toUpperCase()+classe[1].slice(1).toLowerCase() : '';

  const iRef = linhas.findIndex(l => /Referente a/i.test(l));
  if (iRef >= 0){
    const nome = linhas.slice(iRef+1, iRef+4).find(l => /^[A-ZÀ-Ü][A-ZÀ-Ü .'-]{4,}$/.test(l.split(' | ')[0]) && !/\d/.test(l.split(' | ')[0]));
    if (nome) r.titular = nome.split(' | ')[0];
  }

  // Itens da fatura
  const ini = linhas.findIndex(l => /^Itens da Fatura/i.test(l));
  const fim = linhas.findIndex((l,i) => i > ini && /^TOTAL\b/.test(l));
  r.itens = [];
  if (ini >= 0 && fim > ini){
    for (const l of linhas.slice(ini+1, fim)){
      const c = l.split(' | ');
      const desc = c[0];
      let qtd = null, preco = null, valor = null, unid = '';
      if (c[1] && /^kWh$/i.test(c[1])){ unid='kWh'; qtd = num(c[2]); preco = num(c[3]); valor = num(c[4]); }
      else if (c[1] && /,\d{3,}$/.test(c[1]) && c[2]!==undefined){ preco = num(c[1]); valor = num(c[2]); }
      else valor = num(c[1]);
      if (valor === null) continue;
      r.itens.push({desc, unid, qtd, preco, valor});
    }
    const t = num((linhas[fim].split(' | ')[1]||''));
    if (t !== null && r.total == null) r.total = t;
  } else r.avisos.push('Não achei a tabela de itens da fatura.');

  const tec = linhas.find(l => /^Energia kWh\b/i.test(l));
  if (tec){ const c = tec.split(' | '); r.consumo = num(c[c.length-1]); }
  const scee = r.itens.find(i => /SCEE|Energia El[eé]trica|Consumo/i.test(i.desc) && i.unid==='kWh');
  if (r.consumo == null && scee) r.consumo = scee.qtd;

  const comp = r.itens.filter(i => /compensada/i.test(i.desc) && i.unid==='kWh');
  r.kwhCompensado = comp.reduce((s,i)=>s+(i.qtd||0),0);
  r.kwhGD1 = comp.filter(i=>/GD\s*I\b/i.test(i.desc)).reduce((s,i)=>s+(i.qtd||0),0);
  r.kwhGD2 = comp.filter(i=>/GD\s*II\b/i.test(i.desc)).reduce((s,i)=>s+(i.qtd||0),0);

  // Tarifa cheia com impostos: preço do Custo de Disponibilidade ou da Energia Elétrica faturada
  const disp = r.itens.find(i => /Custo de Disponibilidade/i.test(i.desc) && i.preco)
            || r.itens.find(i => /^Energia El[eé]trica/i.test(i.desc) && i.preco);
  r.tarifa = disp ? disp.preco : null;
  if (!r.tarifa) r.avisos.push('Não achei a tarifa na conta. Preencha à mão.');

  // "Fatura Cemig" repassada ao cliente: itens positivos que não são a energia compensada
  // (disponibilidade ou consumo mínimo, iluminação pública, multas, juros...)
  const ehTaxa = i => i.valor > 0 && !/SCEE|compensad/i.test(i.desc);
  r.taxas = r2(r.itens.filter(ehTaxa).reduce((s,i)=>s+i.valor,0));
  r.taxasDetalhe = r.itens.filter(ehTaxa).map(i=>`${i.desc} ${brl(i.valor)}`).join(' + ');

  const saldo = txt.match(/SALDO ATUAL DE GERA[ÇC][ÃA]O:\s*([\d.]+,\d+)/i);
  r.saldoGeracao = saldo ? num(saldo[1]) : null;
  if (!r.kwhCompensado) r.avisos.push('Nenhuma energia compensada nesta conta.');
  return r;
}

/* ===== Fórmulas próprias de permuta (avaliador seguro, sem eval) ===== */
const VARS_FORMULA = {
  kwh:'kWh compensados no mês', consumo:'consumo do mês (kWh)', tarifa:'tarifa cheia da Cemig (R$/kWh)',
  tarifaDesc:'tarifa com o desconto do cliente', desconto:'desconto do cliente (0,30 = 30%)', taxas:'taxas da conta Cemig (R$)',
  contaCemig:'valor total da conta Cemig (R$)', limite:'limite mensal da permuta', gd1:'kWh compensados GD I', gd2:'kWh compensados GD II',
  utilizado:'uso calculado do mês (só na fórmula de cobrança)', excedente:'excedente calculado (só na fórmula de cobrança)'
};
function avaliarFormula(expr, vars){
  const s = String(expr||'').replace(/,(?=\d)/g,'.'); let i = 0;
  const esp = () => { while (/\s/.test(s[i]||'')) i++; };
  const FN = { min:Math.min, max:Math.max, abs:Math.abs, arred:(x,d=2)=>Math.round(x*10**d)/10**d };
  function prim(){
    esp(); const ch = s[i];
    if (ch === '('){ i++; const v = soma(); esp(); if (s[i++] !== ')') throw new Error('falta ")"'); return v; }
    if (ch === '-'){ i++; return -prim(); }
    if (ch === '+'){ i++; return prim(); }
    const n = s.slice(i).match(/^\d+(\.\d+)?/); if (n){ i += n[0].length; return parseFloat(n[0]); }
    const id = s.slice(i).match(/^[A-Za-z_]\w*/);
    if (id){ i += id[0].length; const nome = id[0]; esp();
      if (s[i] === '('){ if (!FN[nome]) throw new Error(`função desconhecida: ${nome}`); i++; const args = [];

/* ===== Cálculos ===== */
function calcVenda(cli, cemig, ajuste = {}){
  const pct = ajuste.desconto ?? cli.desconto ?? 30;
  const desc = pct / 100;
  const tarifa = ajuste.tarifa ?? cemig.tarifa ?? 0;
  const kwh = ajuste.kwhCompensado ?? cemig.kwhCompensado ?? 0;
  const contaInteira = ajuste.contaInteira ?? cli.repassarContaInteira ?? false;
  const taxas = (cli.cobrarTaxas === false) ? 0 : (ajuste.taxas ?? (contaInteira ? (cemig.total ?? 0) : (cemig.taxas ?? 0)));
  const outros = ajuste.outrosDescontos ?? 0;
  const tarifaDesc = Math.round(tarifa * (1 - desc) * 1e9) / 1e9;
  const valorEnergia = r2(kwh * tarifaDesc);
  const total = r2(valorEnergia + taxas - outros);
  const pagaria = r2(kwh * tarifa + taxas - outros);
  return { tipo:'venda', contaInteira, desconto: pct, descontoPadrao: cli.desconto ?? 30, tarifa, tarifaDesc, kwh, valorEnergia, taxas, outros,
           total, pagaria, economia: r2(pagaria - total), valorAPagar: total };
}

function calcPermuta(cli, cemig, ajuste = {}, anteriores = [], usadoGrupo = 0){
  const p = cli.permuta || {};
  const desc = (cli.desconto ?? 30) / 100;
  const tarifa = ajuste.tarifa ?? cemig.tarifa ?? 0;
  const kwh = ajuste.kwhCompensado ?? cemig.kwhCompensado ?? 0;
  const tarifaUsada = p.valoracao === 'desconto' ? Math.round(tarifa*(1-desc)*1e9)/1e9 : tarifa;
  const valorEnergia = r2(kwh * tarifaUsada);
  const taxas = p.incluirTaxas === false ? 0 : (ajuste.taxas ?? cemig.taxas ?? 0);
  const contaCemig = p.incluirContaCemig ? (cemig.total || 0) : 0;
  const varsF = { kwh, consumo: ajuste.consumo ?? cemig.consumo ?? kwh, tarifa, tarifaDesc: Math.round(tarifa*(1-desc)*1e9)/1e9, desconto: desc,
    taxas: ajuste.taxas ?? cemig.taxas ?? 0, contaCemig: cemig.total || 0, limite: Number(p.limite)||0, gd1: cemig.kwhGD1||0, gd2: cemig.kwhGD2||0 };
  let utilizado = r2(valorEnergia + taxas + contaCemig);
  if (p.formulaUso && p.base !== 'kwh') utilizado = r2(avaliarFormula(p.formulaUso, varsF));
  const limiteTotal = Number(p.limite) || 0;
  const limite = Math.max(0, r2(limiteTotal - usadoGrupo));
  const descExc = (Number(p.descontoExcedente) || 0) / 100;
  let excedente = 0, usoMedida, limiteMedida, saldoMes, saldoAcum = null;

  if (p.base === 'kwh'){
    usoMedida = p.formulaUso ? r2(avaliarFormula(p.formulaUso, varsF)) : (ajuste.consumo ?? cemig.consumo ?? kwh);
    limiteMedida = limite;
    saldoMes = limite - usoMedida;
    const excKwh = Math.max(0, usoMedida - limite);
    excedente = r2(excKwh * tarifa * (1 - desc));
  } else {
    usoMedida = utilizado; limiteMedida = limite;
    saldoMes = r2(limite - utilizado);
    excedente = Math.max(0, r2(utilizado - limite));
  }
  let valorAPagar = r2(excedente * (1 - descExc));
  if (p.formulaCobranca) valorAPagar = Math.max(0, r2(avaliarFormula(p.formulaCobranca, {...varsF, limite, utilizado, usoMedida, excedente})));
  if (p.semCobranca) valorAPagar = 0;

  if (p.apuracao === 'acumulada'){
    const usados = anteriores.reduce((s,f)=>s + (f.calc?.usoMedida||0), 0) + usoMedida;
    const limites = (anteriores.length + 1) * limite;
    saldoAcum = r2(limites - usados);
    const jaCobrado = anteriores.reduce((s,f)=>s + (f.calc?.valorAPagar||0), 0);
    const excAcum = Math.max(0, -saldoAcum);
    const excR = p.base === 'kwh' ? excAcum * tarifa * (1 - desc) : excAcum;
    valorAPagar = p.semCobranca ? 0 : Math.max(0, r2(excR * (1 - descExc) - jaCobrado));
    if (p.formulaCobranca && !p.semCobranca) valorAPagar = Math.max(0, r2(avaliarFormula(p.formulaCobranca, {...varsF, limite, utilizado, usoMedida, excedente, saldoAcum})) - jaCobrado);
  }
  const valorAntesExtra = valorAPagar;
  if (ajuste.descontoCobranca) valorAPagar = r2(valorAPagar * (1 - ajuste.descontoCobranca/100));
  if (ajuste.outrosDescontos) valorAPagar = Math.max(0, r2(valorAPagar - ajuste.outrosDescontos));
  const pagaria = r2(kwh * tarifa + (cemig.taxas||0));
  return { tipo:'permuta', valorAntesExtra, outros: ajuste.outrosDescontos || 0, descontoCobranca: ajuste.descontoCobranca || 0, base: p.base || 'reais', apuracao: p.apuracao || 'mensal', valoracao: p.valoracao || 'cheia',
           tarifa, tarifaUsada, kwh, valorEnergia, taxas, contaCemig, utilizado, limite: limiteMedida, usoMedida,
           saldoMes, saldoAcum, excedente, grupo: p.grupo || '', usadoGrupo, regraPropria: !!(p.formulaUso || p.formulaCobranca), limiteTotal, semCobranca: !!p.semCobranca, descontoExcedente: Number(p.descontoExcedente)||0,
           valorAPagar, total: valorAPagar, pagaria, economia: r2(pagaria - valorAPagar), desconto: cli.desconto ?? 30 };
}

/* ===== Pix copia e cola (BR Code estático) ===== */
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .\-@]/g,'').trim();
function pixPayload({chave, nome, cidade, valor, txid}){
  const f = (id, v) => id + String(v.length).padStart(2,'0') + v;
  let k = String(chave||'').trim();
  if (/^[\d./-]+$/.test(k)) k = soDigitos(k);
  const mai = f('00','br.gov.bcb.pix') + f('01', k);
  let p = f('00','01') + f('26', mai) + f('52','0000') + f('53','986');
  if (valor > 0) p += f('54', valor.toFixed(2));
  p += f('58','BR') + f('59', semAcento(nome).slice(0,25) || 'RECEBEDOR') + f('60', semAcento(cidade).slice(0,15) || 'BRASIL');
  p += f('62', f('05', (semAcento(txid)||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25) || '***'));
  p += '6304';
  return p + crc16(p);
}

function acharBase64Pdf(r){
  let achou = null; const vistos = new Set();

    if (achou || v == null) return;

}

function casaBusca(f, q){
  if (!q) return true; const c = S.clientes[f.clienteId] || {};
  return [c.nome, c.uc, c.instalacao, c.titularCemig, c.pagadorCemig, c.responsavel, f.cemig?.titular].join(' ').toLowerCase().includes(q);
}
async function marcarRecebida(f, desfazer){
  const novo = {...f, status: desfazer ? (f.enviadaEm ? 'enviada' : 'gerada') : 'paga'};
  if (desfazer) delete novo.pagaEm; else novo.pagaEm = new Date().toISOString();
  await gravarFatura(novo); toast(`${S.clientes[f.clienteId]?.nome}: ${desfazer ? 'pagamento desfeito' : 'pagamento registrado'}`);
}
async function marcarCemig(f, desfazer){
  if (f.ccId){ const c = S.contasCemig[f.ccId]; if (!c) return;
    const novo = {...c, situacao: desfazer ? 'aberta' : 'paga'}; if (desfazer) delete novo.pagaEm; else novo.pagaEm = new Date().toISOString();
    S.contasCemig[c.id] = novo; await gravar('contasCemig', c.id, novo); if (!S.db) render();
    toast(`Conta Cemig de ${S.clientes[f.clienteId]?.nome}: ${desfazer ? 'voltou para em aberto' : 'paga'}`); return; }
  const novo = {...f}; if (desfazer) delete novo.cemigPagaEm; else novo.cemigPagaEm = new Date().toISOString();
  await gravarFatura(novo); toast(`Conta Cemig de ${S.clientes[f.clienteId]?.nome}: ${desfazer ? 'voltou para em aberto' : 'paga'}`);
}
const botaoRec = f => !ehCobravel(f) ? '' : f.status === 'paga'
  ? `<button class="mini-btn feito" data-rec="${f.id}" data-desf="1" title="Toque para desfazer">${ic('check')} Recebido</button>`
  : `<button class="mini-btn" data-rec="${f.id}">Marcar recebido</button>`;
const acharConta = id => S.faturas[id] || contasComoFaturas().find(f => f.id === id);
const botaoCem = f => (!cemigPaga(f) && ['retida','processando'].includes(f.situacaoCemig))
  ? `<span class="chip cinza" title="A Cemig ainda não liberou esta conta para pagamento">${SIT_CEMIG[f.situacaoCemig]}</span>`
  : cemigPaga(f)
  ? `<button class="mini-btn feito" data-cem="${f.id}" data-desf="1" title="Toque para desfazer">${ic('check')} Cemig paga</button>`
  : `<button class="mini-btn" data-cem="${f.id}">Cemig paga</button>`;
function ligarBotoesPagamento(raiz){
  $$('[data-rec]', raiz).forEach(b => b.onclick = e => { e.stopPropagation(); b.disabled = true; marcarRecebida(S.faturas[b.dataset.rec], !!b.dataset.desf); });
  $$('[data-cem]', raiz).forEach(b => b.onclick = e => { e.stopPropagation(); b.disabled = true; marcarCemig(acharConta(b.dataset.cem), !!b.dataset.desf); });
}

function graficoMeses(meses, dados){
  if (!meses.length) return '<p class="muted">Sem faturas no período.</p>';
  const W = 640, H = 220, pl = 54, pb = 26, pt = 10, pr = 8;
  const max = Math.max(1, ...dados.map(d => d.recebido + d.aberto + d.vencido));
  const passo = Math.pow(10, Math.floor(Math.log10(max))); const topo = Math.ceil(max / passo) * passo;
  const bw = Math.min(46, (W - pl - pr) / meses.length * 0.6), gap = (W - pl - pr) / meses.length;
  const y = v => pt + (H - pt - pb) * (1 - v / topo);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = topo * i / 4; g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grade"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="eixo">${v>=1000?fmtN(v/1000,v%1000?1:0)+' mil':fmtN(v)}</text>`; }
  dados.forEach((d, i) => {
    const x = pl + gap*i + (gap - bw)/2; let base = 0;
    for (const [k, cls] of [['recebido','st-bom'],['aberto','st-aviso'],['vencido','st-critico']]){
      const v = d[k]; if (v <= 0) continue;
      const y1 = y(base + v), y0 = y(base), h = Math.max(1, y0 - y1 - (base ? 2 : 0));
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="3" class="${cls}"/>`; base += v;
    }
    g += `<rect x="${pl + gap*i}" y="${pt}" width="${gap}" height="${H-pt-pb}" fill="transparent" class="alvo" data-tip="${esc(compLabel(meses[i]))}|${brl(d.recebido)}|${brl(d.aberto)}|${brl(d.vencido)}"/>`;
    g += `<text x="${x + bw/2}" y="${H-8}" text-anchor="middle" class="eixo">${compCurta(meses[i])}</text>`;
  });
  return `<div class="legenda"><span><i class="st-bom"></i>Recebido</span><span><i class="st-aviso"></i>Em aberto</span><span><i class="st-critico"></i>Vencido</span></div>
    <div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturas Seltec por mês: recebido, em aberto e vencido">${g}</svg><div class="tip" hidden></div></div>`;
}
function graficoPagadores(lista){
  if (!lista.length) return '<p class="muted">Sem contas Cemig no período.</p>';
  const max = Math.max(...lista.map(l=>l.total), 1);
  return `<div class="hbars">${lista.map(l => `<button class="hbar" data-busca="${esc(l.nome)}" title="Ver contas de ${esc(l.nome)}">
    <span class="nome">${esc(l.nome)}</span><span class="trilho"><span class="barra" style="width:${Math.max(2, l.total/max*100)}%"></span></span>
    <span class="val">${brl(l.total)}<small>${l.aberto>0?`${brl(l.aberto)} em aberto`:'tudo pago'} · ${l.n} conta${l.n>1?'s':''}</small></span></button>`).join('')}</div>`;
}
function ligarTooltip(raiz){
  $$('.graf', raiz).forEach(gr => { const tip = $('.tip', gr);
    const mostra = (alvo, ev) => { const [m, r, a, v] = alvo.dataset.tip.split('|');
      tip.innerHTML = `<b>${m}</b><span><i class="st-bom"></i>Recebido ${r}</span><span><i class="st-aviso"></i>Em aberto ${a}</span><span><i class="st-critico"></i>Vencido ${v}</span>`;
      tip.hidden = false; const rb = gr.getBoundingClientRect(), ra = alvo.getBoundingClientRect();
      tip.style.left = Math.min(rb.width - 170, Math.max(0, ra.left - rb.left + ra.width/2 - 85)) + 'px'; };
    $$('.alvo', gr).forEach(al => { al.addEventListener('mouseenter', e => mostra(al, e)); al.addEventListener('click', e => mostra(al, e)); });
    gr.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

function telaPainel(v){
  intervaloPeriodo(); const P = S.dash;
  const [de, ate] = intervaloPeriodo();
  const q = (P.busca||'').trim().toLowerCase();
  const todas = todasContas().filter(f => f.status !== 'cancelada' && casaBusca(f, q));
  const fs = todas.filter(f => f.competencia >= de && f.competencia <= ate);
  const cob = fs.filter(ehCobravel);
  const soma = (arr, fn) => r2(arr.reduce((s,f)=>s+(fn(f)||0),0));
  const recebido = soma(cob.filter(f=>f.status==='paga'), f=>f.calc.valorAPagar);
  const vencido = soma(cob.filter(estaVencida), f=>f.calc.valorAPagar);
  const aberto = soma(cob.filter(f=>f.status!=='paga' && !estaVencida(f)), f=>f.calc.valorAPagar);
  const cemAberto = fs.filter(cemigEmAberto);
  const cemAtras = todas.filter(cemigAtrasada).sort((a,b)=>a.cemig.vencimento.localeCompare(b.cemig.vencimento));
  const atrasPorPag = {}; cemAtras.forEach(f => { const k = quemPagaCemig(f); (atrasPorPag[k] = atrasPorPag[k] || []).push(f); });
  // meses do gráfico
  let meses = [...new Set(fs.map(f=>f.competencia))].sort();
  const dadosMes = meses.map(m => { const doMes = cob.filter(f=>f.competencia===m);
    return { recebido: soma(doMes.filter(f=>f.status==='paga'), f=>f.calc.valorAPagar), vencido: soma(doMes.filter(estaVencida), f=>f.calc.valorAPagar),
             aberto: soma(doMes.filter(f=>f.status!=='paga'&&!estaVencida(f)), f=>f.calc.valorAPagar) }; });
  // pagadores das contas Cemig
  const pag = {}; fs.filter(f=>f.cemig?.total>0).forEach(f => { const k = quemPagaCemig(f); const o = pag[k] || (pag[k] = {nome:k, total:0, aberto:0, n:0});
    o.total = r2(o.total + f.cemig.total); o.n++; if (cemigEmAberto(f)) o.aberto = r2(o.aberto + f.cemig.total); });
  const pagadores = Object.values(pag).sort((a,b)=>b.total-a.total);
  // devedores (todas as datas, respeitando a busca)
  const dev = {}; todas.filter(estaVencida).forEach(f => { const o = dev[f.clienteId] || (dev[f.clienteId] = {id:f.clienteId, total:0, n:0, maisAntiga:f.vencimento});
    o.total = r2(o.total + f.calc.valorAPagar); o.n++; if (f.vencimento < o.maisAntiga) o.maisAntiga = f.vencimento; });
  const devedores = Object.values(dev).sort((a,b)=>b.total-a.total);
  const dias = d => Math.round((new Date(hojeISO()) - new Date(d)) / 864e5);
  // vencimentos do mês escolhido
  const mv = P.mesVenc;
  const itensVenc = [];
  todas.forEach(f => {
    if (ehCobravel(f) && (f.vencimento||'').startsWith(mv)) itensVenc.push({dia:f.vencimento, tipo:'rec', f, valor:f.calc.valorAPagar});
    if (f.cemig?.total > 0 && (f.cemig.vencimento||'').startsWith(mv) && f.situacaoCemig !== 'retida') itensVenc.push({dia:f.cemig.vencimento, tipo:'cem', f, valor:f.cemig.total});
  });
  const porDia = {}; itensVenc.forEach(i => (porDia[i.dia] = porDia[i.dia] || []).push(i));
  const hoje = hojeISO();

  v.innerHTML += `
  ${S.snapshot ? `<div class="alerta">Esta é a <b>cópia offline</b> da plataforma, com os dados de ${new Date(S.snapshot).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}. O que você mudar aqui fica só neste computador. Para levar as mudanças para a plataforma, use Ajustes → Baixar backup completo e depois, na plataforma, Ajustes → Restaurar backup.</div>` : ''}
  <div class="cab"><h1>Painel</h1></div>
  <div class="filtros-dash">
    <select id="dPer">${PERIODOS.map(([k,n])=>`<option value="${k}" ${k===P.periodo?'selected':''}>${n}</option>`).join('')}</select>
    ${P.periodo==='custom'?`<label class="sel">de <input type="month" id="dDe" value="${P.de}"></label><label class="sel">até <input type="month" id="dAte" value="${P.ate}"></label>`:''}
    <input id="dBusca" class="busca" placeholder="Buscar cliente, UC ou quem paga (ex.: Jomar)" value="${esc(P.busca||'')}">
  </div>
  <p class="muted small">${P.periodo==='tudo'?'Todos os meses':`${compLabel(de)} a ${compLabel(ate)}`}${q?` · filtrando por "${esc(P.busca)}"`:''} · mês de referência das contas</p>
  <div class="kpis">
    <div class="kpi"><small>A receber</small><b>${brl(aberto)}</b><span>${cob.filter(f=>f.status!=='paga'&&!estaVencida(f)).length} faturas no prazo</span></div>
    <div class="kpi alerta-kpi"><small>${ic('alerta')} Vencido sem pagamento</small><b>${brl(vencido)}</b><span>${cob.filter(estaVencida).length} faturas atrasadas</span></div>
    <div class="kpi"><small>${ic('check')} Recebido</small><b>${brl(recebido)}</b><span>${cob.filter(f=>f.status==='paga').length} de ${cob.length} faturas</span></div>
    <div class="kpi"><small>Contas Cemig a pagar</small><b>${brl(soma(cemAberto, f=>f.cemig.total))}</b><span>${cemAberto.length} em aberto${cemAtras.length?` · <b class="neg">${cemAtras.length} atrasada${cemAtras.length>1?'s':''}</b>`:''}</span></div>
  </div>
  ${cardRotina()}
  ${pendenciasMes()}
  <div class="grade2">
    <section class="card"><h2>Faturas Seltec por mês</h2>${graficoMeses(meses, dadosMes)}</section>
    <section class="card"><h2>Contas Cemig por quem paga</h2>${graficoPagadores(pagadores)}</section>
  </div>
  <section class="card">
    <div class="lin venc-topo"><h2 style="margin:0">Vencimentos de ${compLabel(mv)}</h2>
      <div class="acoes nav-mes" style="margin:0"><button class="btn sec mini" id="vAnt" aria-label="Mês anterior">${ic('esq')}</button><button class="btn sec mini" id="vHoje">Hoje</button><button class="btn sec mini" id="vProx" aria-label="Próximo mês">${ic('dir')}</button></div></div>
    ${Object.keys(porDia).length ? `<div class="dias-chips">${Object.keys(porDia).sort().map(d=>`<a href="#painel" data-dia="${d}" class="dia-chip ${d<hoje?'passou':d===hoje?'hoje':''}"><b>${d.slice(8)}</b><span>${porDia[d].length}</span></a>`).join('')}</div>
    <div class="venc">${Object.keys(porDia).sort().map(d => { const its = porDia[d]; const tot = r2(its.reduce((s,i)=>s+i.valor,0));
      return `<div class="venc-dia ${d<hoje?'passou':d===hoje?'hoje':''}" id="dia-${d}"><div class="venc-cab"><b>Dia ${d.slice(8)}</b><span>${new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long'})}${d===hoje?' · hoje':''}</span><span class="tot">${brl(tot)}</span></div>
        ${its.map(i => { const c = S.clientes[i.f.clienteId]||{}; const ok = i.tipo==='rec' ? i.f.status==='paga' : cemigPaga(i.f);
          return `<div class="venc-item ${ok?'ok':(d<hoje?'atrasado':'')}"><span class="tag ${i.tipo}">${i.tipo==='rec'?'Receber':'Pagar Cemig'}</span>
            <span class="quem"><b>${esc(c.nome||'?')}</b><small>${i.tipo==='rec'?`fatura Seltec ${compCurta(i.f.competencia)}`:`paga: ${esc(quemPagaCemig(i.f))}`}</small></span>
            <span class="v">${brl(i.valor)}</span>${i.tipo==='rec'?botaoRec(i.f):botaoCem(i.f)}</div>`; }).join('')}</div>`; }).join('')}</div>`
    : '<p class="muted">Nenhum vencimento registrado neste mês.</p>'}
  </section>
  <section class="card"><h2>Contas Cemig atrasadas <span class="n">${cemAtras.length}</span></h2>
    ${cemAtras.length ? `<p class="small">Total em atraso: <b class="neg">${brl(r2(cemAtras.reduce((s,f)=>s+f.cemig.total,0)))}</b>. Agrupado por quem paga a conta.</p>
      ${Object.entries(atrasPorPag).sort((a,b)=>b[1].length-a[1].length).map(([pg, arr]) => `<details ${Object.keys(atrasPorPag).length<=3?'open':''}><summary><b>${esc(pg)}</b> · ${arr.length} conta${arr.length>1?'s':''} · ${brl(r2(arr.reduce((s,f)=>s+f.cemig.total,0)))}</summary>
        ${arr.map(f => { const c = S.clientes[f.clienteId]||{}; return `<div class="venc-item atrasado"><span class="quem"><b>${esc(c.nome||'?')}</b><small>${compLabel(f.competencia)} · venceu ${isoParaBR(f.cemig.vencimento)} (há ${dias(f.cemig.vencimento)} dias)${f.ccId && S.contasCemig[f.ccId]?.consultaEm ? ` · última conferência no portal ${esc(S.contasCemig[f.ccId].consultaEm.slice(0,5))}` : ''}${f.pdfLink?` · <a href="${esc(f.pdfLink)}" target="_blank" rel="noopener">PDF</a>`:''}</small></span><span class="v">${brl(f.cemig.total)}</span>${botaoCem(f)}</div>`; }).join('')}</details>`).join('')}`
      : `<p class="ok">${ic('checkc')} Nenhuma conta Cemig atrasada.</p>`}
    ${(()=>{ const ret = todas.filter(f => !cemigPaga(f) && f.situacaoCemig==='retida'); return ret.length ? `<p class="muted small">${ret.length} conta${ret.length>1?'s':''} retida${ret.length>1?'s':''} na Cemig (${brl(r2(ret.reduce((s,f)=>s+(f.cemig.total||0),0)))}), ainda sem liberação para pagar.</p>` : ''; })()}
  </section>
  <section class="card"><h2>Clientes devendo à Seltec <span class="n">${devedores.length}</span></h2>
    ${devedores.length ? `<ul class="lista">${devedores.map(d => { const c = S.clientes[d.id]||{};
      return `<li class="lin"><span><b>${esc(c.nome||'?')}</b><span>${d.n} fatura${d.n>1?'s':''} vencida${d.n>1?'s':''} · a mais antiga há ${dias(d.maisAntiga)} dias${c.whatsapp?'':' · sem WhatsApp'}</span></span>
        <span class="acoes" style="margin:0"><b class="neg">${brl(d.total)}</b><button class="btn sec mini" data-busca="${esc(c.nome)}">Ver</button></span></li>`; }).join('')}</ul>`
      : `<p class="ok">${ic('checkc')} Ninguém com fatura vencida.</p>`}
  </section>
  ${q ? historicoBusca(todas, de, ate) : ''}
  ${!listaClientes().length ? `<div class="alerta">Nenhum cliente cadastrado ainda. Comece em <a href="#clientes">Clientes</a>.</div>`:''}`;

  $('#dPer').onchange = e => { P.periodo = e.target.value; render(); };
  const dDe = $('#dDe'), dAte = $('#dAte');
  if (dDe) dDe.onchange = () => { P.de = dDe.value; render(); }; if (dAte) dAte.onchange = () => { P.ate = dAte.value; render(); };
  const b = $('#dBusca'); let tm;
  b.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { P.busca = b.value; const pos = b.selectionStart; render(); const nb = $('#dBusca'); nb.focus(); nb.setSelectionRange(pos,pos); }, 350); };
  $('#vAnt').onclick = () => { P.mesVenc = somaMes(P.mesVenc, -1); render(); };
  $('#vProx').onclick = () => { P.mesVenc = somaMes(P.mesVenc, 1); render(); };
  $('#vHoje').onclick = () => { P.mesVenc = hojeISO().slice(0,7); render(); };
  $$('[data-dia]', v).forEach(a => a.onclick = e => { e.preventDefault(); $('#dia-'+a.dataset.dia)?.scrollIntoView({behavior:'smooth', block:'start'}); });
  $$('[data-busca]', v).forEach(x => x.onclick = () => { P.busca = x.dataset.busca; render(); setTimeout(()=>$('#hist')?.scrollIntoView({behavior:'smooth'}), 50); });
  ligarBotoesPagamento(v); ligarTooltip(v);
  const lb = $('#limparBusca'); if (lb) lb.onclick = () => { P.busca = ''; render(); };
}
function cardRotina(){
  const r = S.rotina; if (!r) return '';
  const quando = r.em ? new Date(r.em).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
  const lista = (arr, fn) => (arr||[]).length ? `<ul class="lista">${arr.map(fn).join('')}</ul>` : '';
  const div = r.divergencias || [], sem = r.semCliente || [], err = r.erros || [];
  return `<section class="card rotina"><div class="lin"><h2 style="margin:0">Conferência automática</h2><small class="muted">${esc(quando)}</small></div>
    <p class="small">${(r.novas||[]).length} conta${(r.novas||[]).length!==1?'s':''} nova${(r.novas||[]).length!==1?'s':''} registrada${(r.novas||[]).length!==1?'s':''} · ${r.conferidas||0} conferida${(r.conferidas||0)!==1?'s':''} com a fatura do Grok${div.length?` · <b class="neg">${div.length} com diferença</b>`:''}${sem.length?` · ${sem.length} sem cliente cadastrado`:''}</p>
    ${div.length?`<details open><summary>Diferenças com a fatura do Grok</summary>${lista(div, d=>`<li><b>${esc(d.cliente)} · ${esc(compLabel(d.competencia))}</b><span>Plataforma ${brl(d.valorPlataforma)} · Grok ${brl(d.valorGrok)}${d.descontoGrok!=null?` (${fmtN(d.descontoGrok,0)}%)`:''} · diferença ${brl(d.diferenca)}${d.obs?` · ${esc(d.obs)}`:''}</span></li>`)}</details>`:''}
    ${sem.length?`<details><summary>Contas sem cliente cadastrado</summary>${lista(sem, d=>`<li><b>${esc(d.arquivo)}</b><span>UC ${esc(d.uc||'?')} · ${esc(d.titular||'')} · ${brl(d.totalCemig)}</span></li>`)}<a class="btn sec mini" href="#clientes">Cadastrar</a></details>`:''}
    ${err.length?`<details><summary>Erros</summary>${lista(err, d=>`<li><b>${esc(d.arquivo||'')}</b><span>${esc(d.motivo||'')}</span></li>`)}</details>`:''}
  </section>`;
}
function pendenciasMes(){
  const comp = mesAtual(); const fs = todasContas().filter(f=>f.competencia===comp && f.status!=='cancelada');
  const faltam = listaClientes().filter(c => !fs.some(f=>f.clienteId===c.id) && c.tipo!=='sem_fatura');
  const naoEnv = fs.filter(f=>f.status==='gerada' && ehCobravel(f));
  if (!faltam.length && !naoEnv.length) return '';
  return `<section class="card pend"><h2>Pendências de ${compLabel(comp)}</h2>
    ${faltam.length?`<details><summary>${faltam.length} cliente${faltam.length>1?'s':''} sem conta Cemig lida</summary><p class="small">${faltam.map(c=>esc(c.nome)).join(' · ')}</p><a class="btn sec mini" href="#nova">Ler contas</a></details>`:''}
    ${naoEnv.length?`<details><summary>${naoEnv.length} fatura${naoEnv.length>1?'s':''} gerada${naoEnv.length>1?'s':''} e não enviada${naoEnv.length>1?'s':''}</summary><p class="small">${naoEnv.map(f=>`${esc(S.clientes[f.clienteId]?.nome)} (${brl(f.calc.valorAPagar)})`).join(' · ')}</p><a class="btn sec mini" href="#faturas">Ir para faturas</a></details>`:''}
  </section>`;
}
function historicoBusca(todas, de, ate){
  const fs = todas.filter(f => f.competencia >= de && f.competencia <= ate).sort((a,b)=>b.competencia.localeCompare(a.competencia) || (S.clientes[a.clienteId]?.nome||'').localeCompare(S.clientes[b.clienteId]?.nome||''));
  const meses = [...new Set(fs.map(f=>f.competencia))];
  const clientes = [...new Set(fs.map(f=>f.clienteId))];
  const totCem = r2(fs.reduce((s,f)=>s+(f.cemig?.total||0),0)), totSel = r2(fs.filter(ehCobravel).reduce((s,f)=>s+f.calc.valorAPagar,0));
  return `<section class="card" id="hist"><div class="lin"><h2 style="margin:0">Histórico de "${esc(S.dash.busca)}"</h2><button class="btn sec mini" id="limparBusca">Limpar</button></div>
    <p class="small">${clientes.length} cliente${clientes.length!==1?'s':''} · ${fs.length} conta${fs.length!==1?'s':''} · faturas Seltec ${brl(totSel)} · contas Cemig ${brl(totCem)}</p>
    ${meses.map(m => { const doMes = fs.filter(f=>f.competencia===m);
      return `<div class="hist-mes"><h4>${compLabel(m)}</h4>${doMes.map(f => { const c = S.clientes[f.clienteId]||{};
        return `<div class="venc-item"><span class="quem"><b>${esc(c.nome)}</b><small>Seltec: ${f.calc?.tipo==='so_cemig'?'sem cobrança':`${brl(f.calc?.valorAPagar)} · ${STATUS[estaVencida(f)?'vencida':f.status]?.[0]||f.status} · vence ${isoParaBR(f.vencimento)}`}<br>Cemig: ${brl(f.cemig?.total)} · vence ${isoParaBR(f.cemig?.vencimento)} · paga por ${esc(quemPagaCemig(f))}${cemigPaga(f)?' · paga':cemigAtrasada(f)?' · <b class="neg">atrasada</b>':f.situacaoCemig&&SIT_CEMIG[f.situacaoCemig]?' · '+SIT_CEMIG[f.situacaoCemig]:''}${f.pdfLink?` · <a href="${esc(f.pdfLink)}" target="_blank" rel="noopener">PDF</a>`:''}</small></span>
          <span class="col-bot">${botaoRec(f)}${f.cemig?.total>0?botaoCem(f):''}</span></div>`; }).join('')}</div>`; }).join('') || '<p class="muted">Nada encontrado no período.</p>'}
  </section>`;
}

/* ===== Nova fatura ===== */
function telaNova(v){
  v.innerHTML += `
  <div class="cab"><h1>Nova fatura</h1></div>
  <label class="drop" id="drop">
    <input type="file" id="arqs" accept="application/pdf" multiple hidden>
    <b>Toque para escolher os PDFs das contas da Cemig</b>
    <span>Pode enviar várias de uma vez. O sistema lê cada conta, encontra o cliente pela unidade consumidora e calcula a fatura.</span>
  </label>
  <section class="card" id="secDriveNova"></section>
  <div id="lote"></div>`;
  desenharDriveNova();
  const inp = $('#arqs');
  inp.onchange = () => { processarArquivos([...inp.files]); inp.value=''; };
  const d = $('#drop');
  d.ondragover = e => { e.preventDefault(); d.classList.add('sobre'); };
  d.ondragleave = () => d.classList.remove('sobre');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('sobre'); processarArquivos([...e.dataTransfer.files].filter(f=>/pdf$/i.test(f.name)||f.type==='application/pdf')); };
  desenharLote();
}
function desenharDriveNova(lista){
  const el = $('#secDriveNova'); if (!el) return;
  const d = dcfg();
  if (!S.mcp){ el.innerHTML = `<h2>Google Drive</h2><p class="muted">A busca no Drive funciona com a plataforma aberta no Claude. Aqui, use o botão acima.</p>`; return; }
  if (!d.pastaCemig?.id){ el.innerHTML = `<h2>Google Drive</h2><p class="muted">Escolha a pasta das contas Cemig em <a href="#config">Ajustes</a>.</p>`; return; }
  const importados = new Set(Object.values(S.faturas).map(f=>f.driveCemigId).filter(Boolean));
  const noLote = new Set(S.lote.map(i=>i.driveId).filter(Boolean));
  el.innerHTML = `<div class="lin"><div><h2 style="margin:0">Contas na pasta "${esc(d.pastaCemig.nome)}"</h2><small>Pelo Google Drive conectado ao seu Claude</small></div>
    <button class="btn sec" id="buscarDrive">${lista?'Atualizar':'Buscar contas'}</button></div>
    ${lista ? (lista.length ? `<ul class="lista drive">${lista.map(f => { const ja = importados.has(f.id), lt = noLote.has(f.id);
      return `<li><label class="check"><input type="checkbox" data-df="${f.id}" data-nome="${esc(f.title)}" ${!ja&&!lt?'checked':''} ${lt?'disabled':''}>
      <span><b>${esc(f.title)}</b><span>${new Date(f.createdTime||f.modifiedTime).toLocaleDateString('pt-BR')}${ja?' · <em class="ok">fatura já gerada</em>':''}${lt?' · na lista abaixo':''}</span></span></label></li>`; }).join('')}</ul>
      <button class="btn" id="importarDrive">Ler as contas marcadas</button>` : '<p class="muted">Nenhum PDF na pasta.</p>') : ''}`;
  $('#buscarDrive').onclick = async () => {
    const b = $('#buscarDrive'); b.disabled = true; b.textContent = 'Buscando…';
    try { S.listaDrive = await listarPdfsDrive(d.pastaCemig.id); desenharDriveNova(S.listaDrive); }
    catch(e){ toast(msgDrive(e), 'erro'); b.disabled = false; b.textContent = 'Buscar contas'; }
  };
  const imp = $('#importarDrive'); if (imp) imp.onclick = () => {
    const sel = $$('[data-df]:checked', el).map(c => ({name:c.dataset.nome, driveId:c.dataset.df}));
    if (!sel.length){ toast('Marque ao menos uma conta.'); return; }
    processarArquivos(sel).then(()=>desenharDriveNova(S.listaDrive));
  };
}
async function processarArquivos(files){
  for (const f of files){
    const item = { id: Math.random().toString(36).slice(2), arquivo: f.name, estado:'lendo', ajuste:{}, driveId: f.driveId || '' };
    S.lote.unshift(item); desenharLote();
    try {
      item.bytes = f.driveId ? await baixarDrive(f.driveId) : new Uint8Array(await f.arrayBuffer());
      item.cemig = lerContaCemig(await extrairLinhasPdf(item.bytes));
      const c = acharClientePorUC(item.cemig.uc);
      item.clienteId = c?.id || '';
      item.vencimento = item.cemig.vencimento;
      item.estado = 'pronto';
    } catch(e){ item.estado = 'erro'; item.erro = e.code ? msgDrive(e) : (e.message || String(e)); }
    desenharLote();
  }
}
function calcFatura(cli, cemig, ajuste, competencia){
  const idF = `${cli.id}_${competencia}`;
  if (cli.tipo !== 'permuta') return calcVenda(cli, cemig, ajuste);
  const p = cli.permuta || {};
  const ant = p.apuracao==='acumulada' ? faturasDoCliente(cli.id).filter(f=>f.competencia < competencia && f.id!==idF) : [];
  let usadoGrupo = 0;
  if (p.grupo){
    const g = p.grupo.trim().toLowerCase();
    usadoGrupo = r2(Object.values(S.faturas).filter(f => f.competencia===competencia && f.clienteId!==cli.id && f.status!=='cancelada'
      && (S.clientes[f.clienteId]?.permuta?.grupo||'').trim().toLowerCase()===g).reduce((s,f)=>s+(f.calc?.usoMedida||0),0));
  }
  return calcPermuta(cli, cemig, ajuste, ant, usadoGrupo);
}
function calcItem(it){
  const cli = S.clientes[it.clienteId]; if (!cli || !it.cemig) return null;
  if (cli.tipo === 'sem_fatura') return { tipo:'so_cemig', kwh: it.cemig.kwhCompensado||0, valorAPagar:0, total:0, economia:0 };
  return calcFatura(cli, it.cemig, it.ajuste, it.cemig.competencia);
}
function resumoCalc(c){
  if (!c) return '<p class="muted">Escolha o cliente para ver o cálculo.</p>';
  if (c.tipo === 'so_cemig') return '<p class="muted">Sem fatura Seltec: só a conta Cemig fica registrada para controlar o pagamento.</p>';
  if (c.tipo === 'venda') return `<table class="calc">
    <tr><td>Energia compensada</td><td>${fmtN(c.kwh)} kWh × ${fmtN(c.tarifaDesc,6)}</td><td>${brl(c.valorEnergia)}</td></tr>
    <tr><td>Fatura Cemig (taxas)</td><td></td><td>${brl(c.taxas)}</td></tr>
    ${c.outros?`<tr><td>Outros descontos</td><td></td><td>- ${brl(c.outros)}</td></tr>`:''}
    <tr class="tot"><td>Total da fatura Seltec</td><td>desconto ${c.desconto}%</td><td>${brl(c.total)}</td></tr>
    <tr class="mut"><td>Cliente pagaria à Cemig</td><td></td><td>${brl(c.pagaria)}</td></tr>
    <tr class="mut"><td>Economia do cliente</td><td></td><td>${brl(c.economia)}</td></tr></table>`;
  return `<table class="calc">
    <tr><td>Energia compensada</td><td>${fmtN(c.kwh)} kWh × ${fmtN(c.tarifaUsada,6)} (${c.valoracao==='desconto'?'com desconto':'tarifa cheia'})</td><td>${brl(c.valorEnergia)}</td></tr>
    <tr><td>Taxas da conta Cemig</td><td></td><td>${brl(c.taxas)}</td></tr>
    ${c.contaCemig?`<tr><td>Conta Cemig paga pela Seltec</td><td></td><td>${brl(c.contaCemig)}</td></tr>`:''}
    <tr><td>Total utilizado</td><td></td><td>${brl(c.utilizado)}</td></tr>
    ${c.usadoGrupo?`<tr><td>Limite do grupo "${esc(c.grupo)}"</td><td>já usado por outras UCs: ${c.base==='kwh'?fmtN(c.usadoGrupo)+' kWh':brl(c.usadoGrupo)}</td><td>${c.base==='kwh'?fmtN(c.limiteTotal)+' kWh':brl(c.limiteTotal)}</td></tr>`:''}
    <tr><td>Limite disponível</td><td>${c.base==='kwh'?`uso ${fmtN(c.usoMedida)} kWh`:''}</td><td>${c.base==='kwh'?fmtN(c.limite)+' kWh':brl(c.limite)}</td></tr>
    <tr><td>Excedente</td><td>${c.semCobranca?'não cobrado (só acompanhamento)':c.descontoExcedente?`desconto ${c.descontoExcedente}%`:''}</td><td>${brl(c.excedente)}</td></tr>
    ${c.saldoAcum!==null?`<tr class="mut"><td>Saldo acumulado</td><td></td><td>${c.base==='kwh'?fmtN(c.saldoAcum)+' kWh':brl(c.saldoAcum)}</td></tr>`:''}
    <tr class="tot"><td>Valor a cobrar</td><td></td><td>${brl(c.valorAPagar)}</td></tr></table>`;
}
function desenharLote(){
  const el = $('#lote'); if (!el) return;
  const opts = sel => `<option value="">— escolher cliente —</option>` + listaClientes().map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)} (${esc(c.uc||'')})</option>`).join('') + `<option value="__novo">Cadastrar cliente novo…</option>`;
  el.innerHTML = S.lote.map(it => {
    if (it.estado === 'lendo') return `<div class="card item"><b>${esc(it.arquivo)}</b><p class="muted">Lendo o PDF…</p></div>`;
    if (it.estado === 'erro') return `<div class="card item erro"><b>${esc(it.arquivo)}</b><p>${esc(it.erro)}</p><button class="btn sec" data-rem="${it.id}">Remover</button></div>`;
    const cm = it.cemig, cli = S.clientes[it.clienteId];
    const dup = cli && S.faturas[`${cli.id}_${cm.competencia}`];
    if (it.estado === 'gerado') return `<div class="card item ok"><div class="lin"><b>${esc(cli?.nome)}</b>${chip('gerada')}</div>
      ${S.faturas[it.faturaId]?.calc?.tipo==='so_cemig' ? `<p>Conta Cemig de ${compLabel(cm.competencia)} registrada: <b>${brl(cm.total)}</b></p><div class="acoes"><button class="btn sec" data-rem="${it.id}">Fechar</button></div></div>`
      : `<p>Fatura de ${compLabel(cm.competencia)} gerada: <b>${brl(S.faturas[it.faturaId]?.calc?.valorAPagar)}</b></p>
      <div class="acoes"><button class="btn" data-pdf="${it.faturaId}">Baixar PDF</button>${linkWhats(S.faturas[it.faturaId])}<button class="btn sec" data-rem="${it.id}">Fechar</button></div></div>`}`;
    const c = calcItem(it);
    return `<div class="card item" data-it="${it.id}">
      <div class="lin"><b>${esc(it.arquivo)}</b><button class="x" data-rem="${it.id}" title="Remover" aria-label="Remover">${ic('x')}</button></div>
      <div class="dados">
        <span><small>Mês</small>${compLabel(cm.competencia)}</span><span><small>UC</small>${esc(cm.uc||'—')}</span>
        <span><small>Titular Cemig</small>${esc(cm.titular||'—')}</span><span><small>Conta Cemig</small>${brl(cm.total)}</span>
        <span><small>Consumo</small>${fmtN(cm.consumo)} kWh</span><span><small>Compensado</small>${fmtN(cm.kwhCompensado)} kWh${cm.kwhGD2?` <em>(GD II ${fmtN(cm.kwhGD2)})</em>`:''}</span>
      </div>
      ${cm.avisos.length?`<div class="alerta">${cm.avisos.map(esc).join('<br>')}</div>`:''}
      <label class="campo">Cliente <select data-k="cli">${opts(it.clienteId)}</select></label>
      ${!cli && cm.uc ? `<p class="muted">Nenhum cliente com a UC ${esc(cm.uc)}. Escolha um da lista ou cadastre.</p>`:''}
      ${cli?.tipo==='sem_fatura'?`<div class="alerta">Este cliente não gera fatura Seltec. Dá para registrar só a conta Cemig, para controlar o pagamento dela.</div>`:''}
      ${dup?`<div class="alerta">Já existe fatura de ${compLabel(cm.competencia)} para este cliente (${STATUS[dup.status]?.[0]}). Gerar de novo vai substituí-la.</div>`:''}
      <details><summary>Conferir / ajustar valores lidos</summary>
        <div class="campos">
          <label class="campo">Tarifa Cemig (R$/kWh)<input data-k="tarifa" inputmode="decimal" value="${fmtN(it.ajuste.tarifa ?? cm.tarifa, 8)}"></label>
          <label class="campo">kWh compensado<input data-k="kwhCompensado" inputmode="decimal" value="${fmtN(it.ajuste.kwhCompensado ?? cm.kwhCompensado)}"></label>
          <label class="campo">Taxas "Fatura Cemig" (R$)<input data-k="taxas" inputmode="decimal" value="${fmtN(it.ajuste.taxas ?? cm.taxas,2)}"></label>
          <label class="campo">Outros descontos (R$)<input data-k="outrosDescontos" inputmode="decimal" value="${fmtN(it.ajuste.outrosDescontos ?? 0,2)}"></label>
          <label class="campo">Vencimento da fatura Seltec<input data-k="venc" type="date" value="${it.vencimento||''}"></label>
        </div>
        <p class="muted small">Taxas lidas: ${esc(cm.taxasDetalhe||'nenhuma')}</p>
      </details>
      <div class="prev">${resumoCalc(c)}</div>
      <div class="acoes">${cli?.tipo==='sem_fatura' ? `<button class="btn" data-gerar="${it.id}">Registrar conta Cemig · ${brl(cm.total)}</button>`
        : `<button class="btn" data-gerar="${it.id}" ${cli?'':'disabled'}>Gerar fatura${cli?` · ${brl(c?.valorAPagar)}`:''}</button>`}</div>
    </div>`;
  }).join('') + (S.lote.filter(i=>i.estado==='pronto' && S.clientes[i.clienteId]).length > 1 ? `<button class="btn grande" id="gerarTodas">Gerar / registrar todas as prontas</button>` : '');

  $$('[data-rem]', el).forEach(b => b.onclick = () => { S.lote = S.lote.filter(i=>i.id!==b.dataset.rem); desenharLote(); });
  $$('[data-pdf]', el).forEach(b => b.onclick = () => baixarPdf(S.faturas[b.dataset.pdf]));
  $$('[data-gerar]', el).forEach(b => b.onclick = () => gerarItem(S.lote.find(i=>i.id===b.dataset.gerar), b));
  const gt = $('#gerarTodas', el); if (gt) gt.onclick = async () => { gt.disabled = true; for (const it of S.lote.filter(i=>i.estado==='pronto' && S.clientes[i.clienteId])) await gerarItem(it); };
  $$('[data-it]', el).forEach(card => {
    const it = S.lote.find(i=>i.id===card.dataset.it);
    $$('[data-k]', card).forEach(inp => {
      const k = inp.dataset.k;
      const ev = inp.tagName === 'SELECT' || inp.type==='date' ? 'change' : 'input';
      inp.addEventListener(ev, () => {
        if (k === 'cli'){ if (inp.value === '__novo'){ editarCliente(null, it); return; } it.clienteId = inp.value; desenharLote(); return; }
        if (k === 'venc'){ it.vencimento = inp.value; return; }
        const n = num(inp.value); if (n === null) delete it.ajuste[k]; else it.ajuste[k] = n;
        $('.prev', card).innerHTML = resumoCalc(calcItem(it));
        const bt = $('[data-gerar]', card); if (bt && S.clientes[it.clienteId]) bt.textContent = `Gerar fatura · ${brl(calcItem(it)?.valorAPagar)}`;
      });
    });
  });
}
async function gerarItem(it, botao){
  const cli = S.clientes[it.clienteId]; if (!cli) return;
  if (botao){ botao.disabled = true; botao.textContent = 'Gerando…'; }
  try {
    const cm = {...it.cemig}; if (it.ajuste.kwhCompensado != null) cm.kwhCompensado = it.ajuste.kwhCompensado;
    const fatura = { id:`${cli.id}_${cm.competencia}`, clienteId: cli.id, competencia: cm.competencia, vencimento: it.vencimento || cm.vencimento,
      cemig: cm, ajuste: it.ajuste, calc: calcItem(it), status:'gerada', criadaEm: new Date().toISOString(), arquivoCemig: it.arquivo,
      ...(it.driveId ? {driveCemigId: it.driveId} : {}) };
    const antiga = S.faturas[fatura.id];
    const soCemig = fatura.calc.tipo === 'so_cemig';
    if (soCemig) fatura.status = 'sem_cobranca';
    const bytes = soCemig ? it.bytes : await montarPdf(fatura, cli, it.bytes);
    if (S.assets){
      try {
        const up1 = await S.assets.upload(new Blob([it.bytes],{type:'application/pdf'}));
        const up2 = await S.assets.upload(new Blob([bytes],{type:'application/pdf'}));
        fatura.cemigPdfId = up1.id; fatura.pdfId = up2.id;
      } catch(e){ toast('PDF gerado, mas não consegui guardá-lo na nuvem ('+e.code+').', 'erro'); }
    }
    S.pdfMem.set(fatura.id, bytes); S.pdfMem.set('cemig_'+fatura.id, it.bytes);
    if (!soCemig && S.mcp && dcfg().salvarSeltec !== false && dcfg().pastaSeltec?.id){
      try { const idS = await salvarSeltecNoDrive(fatura, bytes); if (idS) fatura.driveSeltecId = idS; }
      catch(e){ toast('Fatura gerada, mas não salvei a cópia no Drive. ' + msgDrive(e), 'erro'); }
    }
    await gravarFatura(fatura);
    if (antiga && S.assets){ for (const k of ['pdfId','cemigPdfId']) if (antiga[k] && antiga[k]!==fatura[k]) S.assets.delete(antiga[k]).catch(()=>{}); }
    it.estado = 'gerado'; it.faturaId = fatura.id;
    toast(soCemig ? `Conta Cemig de ${cli.nome} registrada` : `Fatura de ${cli.nome} gerada`);
  } catch(e){ console.error(e); toast('Erro ao gerar: ' + (e.message||e), 'erro'); if (botao){ botao.disabled=false; botao.textContent='Tentar de novo'; } return; }
  desenharLote();
}
async function lerAsset(id){
  if (!id) return null;
  if (S.lerAssetExterno) return await S.lerAssetExterno(id);
  try { const r = await fetch('/_blob/' + id); if (r.ok) return new Uint8Array(await r.arrayBuffer()); } catch(e){}

async function bytesLogo(){
  if (!S.cfg.logoId) return b64ParaBytes(LOGO_PADRAO);
  return await lerAsset(S.cfg.logoId);
}
async function montarPdf(fatura, cli, cemigBytes){
  const historico = [fatura, ...faturasDoCliente(cli.id).filter(f=>f.id!==fatura.id && f.competencia < fatura.competencia)];
  return await gerarPdfFatura({cfg:S.cfg, cli, fatura, historico, cemigBytes, logoBytes: await bytesLogo()});
}
async function bytesDoPdf(f){
  if (f.calc?.tipo === 'so_cemig'){ if (S.pdfMem.has('cemig_'+f.id)) return S.pdfMem.get('cemig_'+f.id); if (f.cemigPdfId) return await lerAsset(f.cemigPdfId); return null; }
  if (S.pdfMem.has(f.id)) return S.pdfMem.get(f.id);
  if (f.pdfId){ const b = await lerAsset(f.pdfId); if (b) return b; }
  return null;
}
async function regerarPdf(f, atualizarDrive){
  const cli = S.clientes[f.clienteId];
  let cem = S.pdfMem.get('cemig_'+f.id);
  if (!cem && f.cemigPdfId) cem = await lerAsset(f.cemigPdfId);
  if (!cem){ toast('A conta da Cemig original não está guardada. Envie o PDF de novo em Nova fatura.', 'erro'); return; }
  const novo = {...f, calc: calcFatura(cli, f.cemig, f.ajuste||{}, f.competencia)};
  const bytes = await montarPdf(novo, cli, cem);
  S.pdfMem.set(f.id, bytes);
  if (S.assets){ try { const up = await S.assets.upload(new Blob([bytes],{type:'application/pdf'})); if (f.pdfId) S.assets.delete(f.pdfId).catch(()=>{}); novo.pdfId = up.id; } catch(e){} }
  novo.atualizadaEm = new Date().toISOString();
  if (atualizarDrive && S.mcp && novo.driveSeltecId){
    try { const idNovo = await salvarSeltecNoDrive(novo, bytes); if (idNovo){ const antigo = novo.driveSeltecId; novo.driveSeltecId = idNovo; drive('trash_file', {fileId: antigo}).catch(()=>{}); } }
    catch(e){ toast('PDF refeito, mas não atualizei a cópia no Drive. ' + msgDrive(e), 'erro'); }
  }
  await gravarFatura(novo);
  if (!atualizarDrive) toast('PDF refeito com os dados atuais do cliente');
}
const nomeArquivo = f => `Fatura ${S.cfg.empresa||'Seltec'} - ${S.clientes[f.clienteId]?.nome||''} - ${compLabel(f.competencia).replace('/','-')}.pdf`.replace(/[\\/:*?"<>|]/g,'');
async function baixarPdf(f){
  if (!f) return;
  const bytes = await bytesDoPdf(f);
  if (!bytes){ toast('PDF não encontrado. Use "Refazer PDF".', 'erro'); return; }
  const blob = new Blob([bytes], {type:'application/pdf'});
  if (S.downloads){
    try { await S.downloads.save({filename: nomeArquivo(f), data: blob}); }
    catch(e){ if (e.code !== 'declined') toast('Não foi possível baixar ('+e.code+').', 'erro'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nomeArquivo(f); document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 500);
}
function textoWhats(f){
  const cli = S.clientes[f.clienteId] || {}, c = f.calc || {};
  const pix = c.valorAPagar > 0 && S.cfg.pixChave ? (f.pix || pixPayload({chave:S.cfg.pixChave, nome:S.cfg.pixNome, cidade:S.cfg.pixCidade, valor:c.valorAPagar, txid:`${soDigitos(cli.uc).slice(-8)}${f.competencia.replace('-','')}`})) : '';
  const situacao = c.valorAPagar > 0 ? `Neste mês o uso passou o limite da permuta em ${brl(c.excedente)}. Valor a pagar: ${brl(c.valorAPagar)}, vencimento ${isoParaBR(f.vencimento)}.\n\nPix copia e cola:\n${pix}` : 'Neste mês o uso ficou dentro do limite da permuta: não há valor a pagar.';
  const tpl = c.tipo === 'permuta' ? S.cfg.msgPermuta : S.cfg.msgVenda;
  return tpl.replace(/\{(\w+)\}/g, (m,k) => ({nome:cli.nome, empresa:S.cfg.empresa, mes:compLabel(f.competencia), valor:brl(c.valorAPagar), vencimento:isoParaBR(f.vencimento), economia:brl(c.economia), pix, situacao}[k] ?? m));
}
function linkWhats(f){
  if (!f) return '';
  const cli = S.clientes[f.clienteId] || {};
  let tel = soDigitos(cli.whatsapp); if (tel && tel.length <= 11) tel = '55' + tel;
  const url = `https://wa.me/${tel}?text=${encodeURIComponent(textoWhats(f))}`;
  return `<a class="btn whats" href="${url}" target="_blank" rel="noopener" data-whats="${f.id}">WhatsApp${tel?'':' (escolher contato)'}</a>`;
}
